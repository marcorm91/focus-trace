name: FocusTrace Playwright accessibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:e2e
      - run: npm run playwright:install:validation
      - run: npm run test:e2e -- --config=playwright.focustrace-example.config.ts
      - name: Upload FocusTrace reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focustrace-reports
          path: |
            artifacts/focustrace/focustrace-chromium.sarif.json
            artifacts/focustrace/focustrace-chromium.junit.xml
            artifacts/focustrace/focustrace-firefox.sarif.json
            artifacts/focustrace/focustrace-firefox.junit.xml
          if-no-files-found: warn
