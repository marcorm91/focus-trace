name: Temporary validate document structure implementation

on:
  push:
    branches:
      - feat/document-structure-landmarks-0.4.0
    paths:
      - .github/workflows/tmp-document-structure-229-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/document-structure-landmarks-0.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Replay implementation recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          wanted = {
              'Add document structure rules and evaluator',
              'Integrate document structure into scan',
              'Extend repeated-landmark naming coverage',
              'Add tests',
              'Update benchmark classifications and evidence',
              'Update public rule documentation',
              'Update parity and page-scan baselines',
          }
          lines = Path('.github/workflows/tmp-document-structure-229.yml').read_text().splitlines()
          index = 0
          executed = []
          while index < len(lines):
              line = lines[index]
              if line.startswith('      - name: '):
                  name = line[len('      - name: '):]
                  index += 1
                  if name not in wanted:
                      continue
                  while index < len(lines) and lines[index] != '        run: |':
                      index += 1
                  if index >= len(lines):
                      raise SystemExit(f'run block missing for {name}')
                  index += 1
                  script = []
                  while index < len(lines):
                      current = lines[index]
                      if current.startswith('      - name: ') or current.startswith('      - uses: '):
                          break
                      if current.startswith('          '):
                          script.append(current[10:])
                      elif current.strip():
                          raise SystemExit(f'unexpected indentation in {name}: {current!r}')
                      else:
                          script.append('')
                      index += 1
                  subprocess.run('\n'.join(script), shell=True, executable='/bin/bash', check=True)
                  executed.append(name)
                  continue
              index += 1

          if set(executed) != wanted:
              missing = wanted - set(executed)
              raise SystemExit(f'implementation recipe incomplete: {sorted(missing)}')
          PY
      - name: Apply staging corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/audit/document-structure.ts')
          text = path.read_text()
          text = text.replace('  DOCUMENT_STRUCTURE_RULES,\n', '', 1)
          text = text.replace("  return explicit === 'heading' ? null : null;", '  return null;', 1)
          text = text.replace('\nexport { DOCUMENT_STRUCTURE_RULES };\n', '\n', 1)
          path.write_text(text)

          replacements = {
              'tests/component-scan.test.ts': (
                  'expect(result.rulesRun).toBe(65);',
                  'expect(result.rulesRun).toBe(72);',
              ),
              'tests/e2e/component-scan.spec.ts': (
                  'expect(fullPageScan.rulesRun).toBe(65);',
                  'expect(fullPageScan.rulesRun).toBe(72);',
              ),
          }
          for name, (old, new) in replacements.items():
              target = Path(name)
              value = target.read_text()
              if old not in value:
                  raise SystemExit(f'{name}: stale baseline marker missing')
              target.write_text(value.replace(old, new, 1))
          PY
      - name: Validate focused implementation
        run: |
          npm run standards:validate
          npm run axe:validate
          npm run capabilities:validate
          npm run rules:validate
          npm run i18n:validate
          npm run deadcode:validate
          npm run check
          npx vitest run tests/document-structure-landmarks.test.ts tests/scan.fixtures.test.ts tests/component-scan.test.ts tests/axe-parity-benchmark.test.ts tests/element-internals-parity.test.ts
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/document-structure-rules.ts lib/audit/landmarks.ts lib/audit/document-structure.ts lib/audit/scan.ts lib/audit/content-model.ts tests/document-structure-landmarks.test.ts tests/scan.fixtures.test.ts tests/component-scan.test.ts tests/e2e/component-scan.spec.ts tests/axe-parity-benchmark.test.ts tests/element-internals-parity.test.ts config/axe-equivalents.json config/axe-parity/best-practice-01.json config/axe-parity/best-practice-02.json config/axe-parity/experimental.json README.md README.es.md docs/RULES.md docs/SEVERITY-AUDIT.md docs/AXE_CORE_PARITY_AUDIT.md
          git commit -m "Feat(a11y): add document structure and landmark coverage"
          git push
