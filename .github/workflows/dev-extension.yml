name: Dev Extension

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run build:firefox
      - name: Add build provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for TARGET in chrome-mv3 firefox-mv3; do
            VERSION="$(node -p "require('./.output/${TARGET}/manifest.json').version")"
            {
              echo "FocusTrace development build"
              echo "Version: ${VERSION}"
              echo "Build date: ${BUILD_DATE}"
              echo "Commit: ${SOURCE_SHA}"
              echo "Source: main"
              echo "Target: ${TARGET}"
            } > ".output/${TARGET}/FOCUSTRACE_BUILD.txt"
          done
      - name: Upload Chrome development extension
        uses: actions/upload-artifact@v4
        with:
          name: focustrace-chrome-dev
          path: .output/chrome-mv3/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Firefox development extension
        uses: actions/upload-artifact@v4
        with:
          name: focustrace-firefox-dev
          path: .output/firefox-mv3/
          if-no-files-found: error
          retention-days: 14
