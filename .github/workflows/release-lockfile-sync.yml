name: Release lockfile sync

on:
  push:
    branches:
      - feat/memory-visual-evidence
    paths:
      - .github/workflows/release-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/memory-visual-evidence
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Restore known-good lockfile and set release version
        run: |
          git checkout ec708351cd12e781d793bec26613414b501457ce -- package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.1.3';
          if (!lock.packages || !lock.packages['']) throw new Error('Missing package-lock root package');
          lock.packages[''].version = '0.1.3';
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate lockfile for 0.1.3"
          git push origin HEAD:feat/memory-visual-evidence
