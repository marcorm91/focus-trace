name: Temporary list cleanup

on:
  push:
    branches:
      - feat/list-structure-validation-0.4.1
    paths:
      - .github/workflows/tmp-list-validation.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/list-structure-validation-0.4.1
      - name: Remove accidental helper branches
        run: git push origin --delete tmp/list-validation-work noop-placeholder || true
