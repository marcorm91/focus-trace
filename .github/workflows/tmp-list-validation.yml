name: Temporary list validation

on:
  push:
    branches:
      - feat/list-structure-validation-0.4.1
    paths:
      - .github/workflows/tmp-list-validation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/list-structure-validation-0.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply list patch
        run: python tools/tmp-list-patch.py
      - name: Validate focused list coverage
        run: |
          npx vitest run tests/list-structure.test.ts tests/content-model.test.ts tests/aria-validator.test.ts
          npm run check
          npm run lint
          npm run deadcode:validate
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit/content-model.ts tests/list-structure.test.ts
          git commit -m "Feat(a11y): harden native and ARIA list validation"
          git push
