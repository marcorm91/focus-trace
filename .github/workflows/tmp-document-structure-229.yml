      - name: Update public rule documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          english = '''\n\n### Document structure and landmark coverage\n\nFocusTrace keeps page-structure best practices separate from deterministic WCAG failures. `FT-REVIEW-030` reviews the absence of a level-one heading, `FT-REVIEW-031` exposed empty headings, `FT-REVIEW-032` paragraphs that visually resemble headings, `FT-REVIEW-033` nested page-level landmarks, `FT-REVIEW-034` repeated banner/contentinfo landmarks, and `FT-REVIEW-035` perceivable content outside landmarks. `FT-WARN-024` reports an explicitly authored `role="region"` with no accessible name as an ARIA authoring warning. These page-wide checks do not run during component scans.\n'''
          spanish = '''\n\n### Cobertura de estructura del documento y landmarks\n\nFocusTrace mantiene las buenas prácticas de estructura de página separadas de los fallos WCAG deterministas. `FT-REVIEW-030` revisa la ausencia de un encabezado de nivel uno, `FT-REVIEW-031` los encabezados vacíos expuestos, `FT-REVIEW-032` los párrafos que visualmente parecen encabezados, `FT-REVIEW-033` los landmarks de nivel de página anidados, `FT-REVIEW-034` los landmarks banner/contentinfo repetidos y `FT-REVIEW-035` el contenido perceptible situado fuera de landmarks. `FT-WARN-024` informa como aviso de autoría ARIA de un `role="region"` creado explícitamente sin nombre accesible. Estas comprobaciones de página completa no se ejecutan en escaneos de componente.\n'''
          for name, block in [('README.md', english), ('README.es.md', spanish)]:
              path = Path(name)
              text = path.read_text()
              if 'FT-REVIEW-030' not in text:
                  path.write_text(text.rstrip() + block + '\n')

          rules = Path('docs/RULES.md')
          rules_text = rules.read_text()
          if '## Document structure and landmark coverage' not in rules_text:
              rules.write_text(rules_text.rstrip() + '''\n\n## Document structure and landmark coverage\n\n- `FT-REVIEW-030` — page has no exposed level-one heading. Whole-document review only.\n- `FT-REVIEW-031` — exposed native/ARIA heading has no usable text or alternative naming contribution.\n- `FT-REVIEW-032` — a short paragraph is substantially larger and bold relative to body text and may be acting as a visual heading. Heuristic REVIEW only.\n- `FT-REVIEW-033` — banner, main, complementary or contentinfo landmark is nested inside another landmark in the same document/application scope.\n- `FT-REVIEW-034` — more than one exposed banner or contentinfo landmark exists in the same document/application scope.\n- `FT-REVIEW-035` — bounded perceivable page content is outside any exposed landmark region.\n- `FT-WARN-024` — explicit `role="region"` resolves with an empty accessible name.\n\nNative header/footer landmarks follow HTML scoping: headers and footers inside article, aside, main, nav or section are not treated as banner/contentinfo. Repeated navigation, complementary, search, region and form landmarks continue to use `FT-REVIEW-010` for distinguishable-name review. Component scans intentionally omit the page-wide rules above.\n''')

          severity = Path('docs/SEVERITY-AUDIT.md')
          severity_text = severity.read_text()
          if 'FT-REVIEW-030' not in severity_text:
              severity.write_text(severity_text.rstrip() + '''\n\n### Document structure and landmarks\n\n`FT-REVIEW-030`, `FT-REVIEW-031`, `FT-REVIEW-032`, `FT-REVIEW-033`, `FT-REVIEW-034` and `FT-REVIEW-035` are `moderate` REVIEW signals: they expose document-structure and landmark best-practice risks without converting contextual APG/HTML guidance into automatic WCAG failures. `FT-WARN-024` is a `moderate` authoring warning because an explicit ARIA region requires an accessible name, while the warning alone is not presented as a deterministic WCAG failure.\n''')

          parity = Path('docs/AXE_CORE_PARITY_AUDIT.md')
          parity_text = parity.read_text()
          parity_text = parity_text.replace('71/105', '79/105').replace('71 of 105', '79 of 105').replace('71 de 105', '79 de 105')
          if '## Document structure applicability update' not in parity_text:
              parity_text = parity_text.rstrip() + '''\n\n## Document structure applicability update\n\nIssue #229 adds evidence for level-one/empty/visually inferred headings, page-level landmark placement, duplicate banner/contentinfo landmarks, landmark-region coverage and explicit region naming. The reviewed axe-core 4.13 benchmark therefore moves to **79 covered relationships out of 105**, with 25 still classified as missing and one benchmark-specific rule not applicable. Best-practice relationships remain REVIEW/overlap/partial where context prevents exact deterministic equivalence.\n'''
          parity.write_text(parity_text + '\n')
          PY

