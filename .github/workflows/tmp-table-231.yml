name: Temporary table 231 validation

on:
  push:
    branches: [feat/table-header-relationships-0.4.2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/tmp-integrate-table-231.mjs
      - run: npx vitest run tests/table-relationships.test.ts tests/component-scan.test.ts --exclude 'tests/e2e/**'
      - run: npm run check
      - run: npm run lint
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/audit/media-scan-extension.ts tests/component-scan.test.ts
          git diff --cached --quiet || git commit -m 'Feat(a11y): integrate table relationship scan'
          git push
