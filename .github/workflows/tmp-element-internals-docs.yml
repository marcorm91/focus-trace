name: Temporary ElementInternals docs

on:
  push:
    branches:
      - feat/element-internals-semantics-0.3.2

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/element-internals-semantics-0.3.2
      - name: Append bounded ElementInternals documentation
        shell: python
        run: |
          from pathlib import Path

          additions = {
            'README.md': '''\n\n### ElementInternals semantic evidence\n\nFocusTrace can use a bounded MAIN-world bridge to observe semantics authored through `ElementInternals` on custom elements. After the user grants the existing page-access permission, FocusTrace registers the bridge for future documents at `document_start` and also attempts to prime the current page. The bridge keeps the raw `ElementInternals` object inside the page world and transfers only normalized role, ARIA reflection strings, form-associated label text/IDs and a form-associated flag. Existing author DOM attributes take precedence.\n\nThis evidence feeds the existing accessible-name and ARIA authoring checks; it does not create a separate conformance claim or increase the axe-core parity count by itself. If the bridge is unavailable or an `attachInternals()` call happened before current-page injection, FocusTrace treats the internals state as unknown rather than inventing a failure. Chromium supports the required MAIN-world scripting path. Firefox gained MAIN-world extension scripting in Firefox 128, while FocusTrace still supports Firefox 115, so Firefox 115–127 intentionally falls back to normal isolated-world inspection. No additional browser permission is introduced.\n''',
            'README.es.md': '''\n\n### Evidencia semántica de ElementInternals\n\nFocusTrace puede usar un bridge acotado en el mundo MAIN para observar semántica definida mediante `ElementInternals` en custom elements. Después de que el usuario conceda el permiso de acceso a páginas ya existente, FocusTrace registra el bridge para futuros documentos en `document_start` y también intenta prepararlo en la página actual. El objeto `ElementInternals` original permanece dentro del mundo de la página y solo se transfieren rol normalizado, strings de reflexión ARIA, texto/IDs de etiquetas asociadas a formulario y un indicador de asociación con formulario. Los atributos DOM definidos por el autor tienen prioridad.\n\nEsta evidencia alimenta las comprobaciones existentes de nombre accesible y autoría ARIA; no crea una afirmación de conformidad separada ni aumenta por sí sola el recuento de paridad con axe-core. Si el bridge no está disponible o `attachInternals()` se ejecutó antes de la inyección en la página actual, FocusTrace trata ese estado interno como desconocido en lugar de inventar un fallo. Chromium permite la ruta necesaria mediante scripting en MAIN. Firefox añadió scripting de extensiones en MAIN en Firefox 128, mientras FocusTrace sigue soportando Firefox 115, por lo que Firefox 115–127 utiliza deliberadamente la inspección normal en mundo aislado. No se añade ningún permiso de navegador.\n''',
            'docs/RULES.md': '''\n\n## ElementInternals evidence\n\nThe static engine can augment existing rule applicability with normalized `ElementInternals` evidence captured by the page-world bridge. The bridge is not a new rule family: captured `role`, ARIA reflection strings and `ElementInternals.labels` are routed into the existing accessible-name and ARIA authoring contracts. Author DOM attributes remain authoritative when present.\n\nThe bridge captures only data produced after its `attachInternals()` wrapper is installed. Missing bridge data is therefore **unknown/inapplicable evidence**, never a reason to manufacture FAIL or WARNING results. Current-page injection is best effort; reliable early capture applies to later documents where the registered runtime script executes at `document_start`. Firefox 115–127 cannot provide this MAIN-world path and degrades conservatively; Firefox 128+ and supported Chromium builds can provide it after normal page access is granted.\n\nThe transferred payload is deliberately bounded and serializable: role, known ARIA reflection strings, up to a bounded number of label text/ID snapshots and form-associated state. Page-owned objects, functions, control values and arbitrary properties are not transferred.\n''',
            'docs/AXE_CORE_PARITY_AUDIT.md': '''\n\n## ElementInternals applicability update\n\nThe 0.3.2 ElementInternals bridge strengthens evidence for existing `partial` / `overlap` relationships such as `aria-allowed-attr`, `aria-required-attr`, command/input naming and meter/progress naming. It does **not** change the reviewed planning total: FocusTrace remains at **66 / 105 covered**, because this work extends modern custom-element applicability rather than converting any previously missing axe-core rule into equivalent coverage.\n\nThe bridge is an independent FocusTrace implementation. axe-core remains a development benchmark only. Normative interpretation continues to come from WAI-ARIA, AccName, HTML and WCAG.\n''',
          }

          for filename, addition in additions.items():
            path = Path(filename)
            text = path.read_text()
            heading = addition.strip().splitlines()[0]
            if heading in text:
              continue
            path.write_text(text.rstrip() + addition + '\n')
      - name: Commit docs and remove temporary workflow
        run: |
          rm .github/workflows/tmp-element-internals-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md docs/RULES.md docs/AXE_CORE_PARITY_AUDIT.md .github/workflows/tmp-element-internals-docs.yml
          git commit -m "Docs(a11y): document ElementInternals evidence model"
          git push origin HEAD:feat/element-internals-semantics-0.3.2
