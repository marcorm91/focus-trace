name: Obsolete code cleanup v2

on:
  push:
    branches:
      - fix/empty-state-consistency
    paths:
      - .github/workflows/cleanup-obsolete-code-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/empty-state-consistency
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Reuse validated cleanup script
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/cleanup-obsolete-code.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/focustrace-cleanup.js').write_text(script)
          PY
          node /tmp/focustrace-cleanup.js
          git rm -f lib/runtime/structure-map.ts tests/structure-map.test.ts
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove obsolete structure and layout remnants"
          git push origin HEAD:fix/empty-state-consistency
