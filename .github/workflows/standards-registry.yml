name: Standards Registry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - '**'
    paths:
      - 'tools/act-sync.mjs'
      - 'tools/aria-sync.mjs'
      - 'tools/axe-sync.mjs'
      - 'tools/axe-validate.mjs'
      - 'tools/language-sync.mjs'
      - 'tools/wcag-sync.mjs'
      - 'tools/html-sync.mjs'
      - 'tools/specs-sync.mjs'
      - 'tools/*-diff.mjs'
      - 'tools/standards-sync.mjs'
      - 'tools/standards-utils.mjs'
      - 'tools/standards-validate.mjs'
      - 'config/axe-equivalents.json'
      - '.github/workflows/standards-registry.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: standards-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Preserve current snapshots
        shell: bash
        run: |
          cp generated/act-catalog.json /tmp/act-before.json
          cp generated/aria-registry.json /tmp/aria-before.json
          cp generated/axe-rule-severities.json /tmp/axe-before.json
          cp generated/language-subtags.json /tmp/language-before.json
          cp generated/wcag-catalog.json /tmp/wcag-before.json
          cp generated/html-obsolete-catalog.json /tmp/html-before.json
          cp generated/standards-sources.json /tmp/sources-before.json

      - name: Sync public standards registries and axe benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/standards-sync.mjs

      - name: Validate generated registries and cross-links
        run: |
          node tools/standards-validate.mjs
          node tools/axe-validate.mjs

      - name: Detect registry changes
        id: changes
        shell: bash
        run: |
          FILES=(
            generated/act-catalog.json
            generated/aria-registry.json
            generated/axe-rule-severities.json
            generated/language-subtags.json
            generated/wcag-catalog.json
            generated/html-obsolete-catalog.json
            generated/standards-sources.json
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            node tools/standards-diff.mjs \
              /tmp/act-before.json generated/act-catalog.json \
              /tmp/aria-before.json generated/aria-registry.json \
              /tmp/language-before.json generated/language-subtags.json \
              /tmp/wcag-before.json generated/wcag-catalog.json \
              /tmp/html-before.json generated/html-obsolete-catalog.json \
              /tmp/sources-before.json generated/standards-sources.json \
              > /tmp/standards-report.md
            node tools/axe-diff.mjs \
              /tmp/axe-before.json generated/axe-rule-severities.json config/axe-equivalents.json \
              >> /tmp/standards-report.md
            cat /tmp/standards-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bootstrap snapshots on development branch
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/act-catalog.json generated/aria-registry.json generated/axe-rule-severities.json \
            generated/language-subtags.json generated/wcag-catalog.json generated/html-obsolete-catalog.json generated/standards-sources.json
          git commit -m 'chore: sync standards registries and axe benchmark'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open or refresh upstream registry PR
        if: steps.changes.outputs.changed == 'true' && !(github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH='bot/standards-registry-sync'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add generated/act-catalog.json generated/aria-registry.json generated/axe-rule-severities.json \
            generated/language-subtags.json generated/wcag-catalog.json generated/html-obsolete-catalog.json generated/standards-sources.json
          git commit -m 'chore: sync standards registries and axe benchmark'
          git push origin "$BRANCH" --force

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title 'chore: sync accessibility standards and axe benchmark' \
              --body-file /tmp/standards-report.md
          else
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'chore: sync accessibility standards and axe benchmark' \
              --body-file /tmp/standards-report.md; then
              gh issue create \
                --title 'Accessibility standards or axe benchmark changed' \
                --body-file /tmp/standards-report.md
              exit 1
            fi
          fi
