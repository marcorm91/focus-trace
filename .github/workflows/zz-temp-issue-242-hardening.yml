name: temp-issue-242-hardening
on:
  push:
    branches:
      - feat/saved-user-flow-regression-0.7.0
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/saved-user-flow-regression-0.7.0
      - run: python tools/zz-issue-242-hardening.py
      - run: |
          git rm .github/workflows/zz-temp-issue-242-hardening.yml tools/zz-issue-242-hardening.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/runtime/saved-flow.ts tests/saved-flow.test.ts entrypoints/sidepanel/views/ReplayView.tsx entrypoints/sidepanel/views/TraceView.tsx entrypoints/sidepanel/views/SavedFlowRegressionPanel.tsx
          git commit -m "Fix(replay): keep saved regression lifecycle conservative"
          git push origin HEAD:feat/saved-user-flow-regression-0.7.0
