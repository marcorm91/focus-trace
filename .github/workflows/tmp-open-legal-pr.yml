name: Temporary open legal notices PR

on:
  push:
    branches:
      - chore/legal-third-party-notices
    paths:
      - .github/workflows/tmp-open-legal-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/legal-third-party-notices
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Adds explicit third-party licensing and trademark notices for the public AXE-CORE® benchmark metadata used by FocusTrace during development.

          - adds `THIRD_PARTY_NOTICES.md` with the pinned upstream source, MPL-2.0 attribution, trademark notice and non-affiliation statement;
          - adds a snapshot-specific notice next to `generated/axe-rule-severities.json`;
          - updates `axe:sync` so future benchmark refreshes regenerate the matching notice automatically;
          - adds CI validation so the notice must stay aligned with the pinned AXE-CORE® release/tag and upstream license URL;
          - extends `TRADEMARKS.md` with third-party mark handling and the required AXE® / AXE-CORE® attribution;
          - keeps FocusTrace-authored code under `GPL-3.0-only`; this PR does not add AXE-CORE® as a runtime dependency or copy the AXE-CORE® engine into the extension.

          ## Scope

          The retained benchmark snapshot contains only public rule metadata used for reproducible development comparisons: rule identifier, impact, enabled state and tags. It remains development-only and excluded from browser builds.

          FocusTrace remains an independent implementation. WCAG, ACT Rules, WAI-ARIA, AccName, HTML and APG remain the normative sources for detector behavior.

          No version bump, tag or release is included.
          EOF
          gh pr view --repo "$GITHUB_REPOSITORY" --head chore/legal-third-party-notices >/dev/null 2>&1 || \
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head chore/legal-third-party-notices \
              --title "Chore(legal): add third-party benchmark notices" --body-file /tmp/pr-body.md
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-open-legal-pr.yml
          git commit -m "Chore(ci): remove temporary legal PR workflow"
          git push
