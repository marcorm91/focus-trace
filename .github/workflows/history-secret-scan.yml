name: History Secret Scan

on:
  pull_request:
    paths:
      - '.github/workflows/history-secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch retained pull-request refs
        shell: bash
        run: |
          git fetch origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge' \
            --force

      - name: Prove checkout coverage
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          echo "Commits reachable from all refs: $(git rev-list --all --count)"
          echo "Remote branch refs: $(git for-each-ref refs/remotes/origin --format='%(refname)' | wc -l)"
          echo "Retained PR refs: $(git for-each-ref refs/remotes/pull --format='%(refname)' | wc -l)"

      - name: Enumerate every historical blob reachable from fetched refs
        shell: bash
        run: |
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(rest)' \
            | awk '$2 == "blob" {print $1}' \
            | sort -u \
            > all-historical-blobs.txt
          echo "Unique historical blobs: $(wc -l < all-historical-blobs.txt)"

      - name: Scan every ref patch with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --report-format=json --report-path=/repo/gitleaks-report.json --log-opts="--all" /repo

      - name: Scan every historical blob with Gitleaks
        shell: bash
        run: |
          stream_blobs() {
            while IFS= read -r sha; do
              printf '\nFOCUSTRACE_BLOB %s\n' "$sha"
              git cat-file blob "$sha"
            done < all-historical-blobs.txt
          }
          stream_blobs \
            | docker run --rm -i \
                -v "$PWD:/repo" \
                ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
                stdin --redact --report-format=json --report-path=/repo/gitleaks-blob-report.json

      - name: Independently scan all-ref patch stream with TruffleHog
        shell: bash
        run: |
          git log --all -p --full-history --no-ext-diff --binary \
            | docker run --rm -i \
                ghcr.io/trufflesecurity/trufflehog:3.97.0@sha256:8eac1e631d18f4f6d5e00bc3420ef7415bddb9b8db66f968cfdb579a470d3392 \
                stdin --no-update --no-verification --json --fail \
            > trufflehog-report.json

      - name: Independently scan every historical blob with TruffleHog
        shell: bash
        run: |
          stream_blobs() {
            while IFS= read -r sha; do
              printf '\nFOCUSTRACE_BLOB %s\n' "$sha"
              git cat-file blob "$sha"
            done < all-historical-blobs.txt
          }
          stream_blobs \
            | docker run --rm -i \
                ghcr.io/trufflesecurity/trufflehog:3.97.0@sha256:8eac1e631d18f4f6d5e00bc3420ef7415bddb9b8db66f968cfdb579a470d3392 \
                stdin --no-update --no-verification --json --fail \
            > trufflehog-blob-report.json

      - name: Check historical sensitive filenames
        shell: bash
        run: |
          git log --all --name-only --format= \
            | sed '/^$/d' \
            | sort -u \
            | grep -Ei '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|credentials([^/]*$|/)|secrets?([^/]*$|/))|\.(pem|key|p12|pfx)$' \
            > sensitive-history-paths.txt || true
          if [ -s sensitive-history-paths.txt ]; then
            echo 'Historical paths requiring manual review:'
            cat sensitive-history-paths.txt
          else
            echo 'No historically committed secret-file patterns found.'
          fi

      - name: Upload redacted scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-scan-evidence
          path: |
            gitleaks-report.json
            gitleaks-blob-report.json
            trufflehog-report.json
            trufflehog-blob-report.json
            sensitive-history-paths.txt
            all-historical-blobs.txt
          if-no-files-found: ignore
          retention-days: 7
