name: Temporary fix document structure staging

on:
  push:
    branches:
      - feat/document-structure-landmarks-0.4.0
    paths:
      - .github/workflows/tmp-document-structure-229-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/document-structure-landmarks-0.4.0
      - name: Patch staging workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-document-structure-229.yml')
          text = path.read_text()

          text = text.replace(
              "            DOCUMENT_STRUCTURE_RULES,\n            DUPLICATE_SINGLETON_LANDMARK_RULE,",
              "            DUPLICATE_SINGLETON_LANDMARK_RULE,",
              1,
          )
          text = text.replace(
              "            return explicit === 'heading' ? null : null;",
              "            return null;",
              1,
          )
          text = text.replace(
              "          export { DOCUMENT_STRUCTURE_RULES };\n          EOF",
              "          EOF",
              1,
          )

          marker = "            'tests/scan.fixtures.test.ts': [\n              ('expect(result.rulesRun).toBe(65);', 'expect(result.rulesRun).toBe(72);'),\n            ],"
          replacement = marker + "\n            'tests/component-scan.test.ts': [\n              ('expect(result.rulesRun).toBe(65);', 'expect(result.rulesRun).toBe(72);'),\n            ],\n            'tests/e2e/component-scan.spec.ts': [\n              ('expect(fullPageScan.rulesRun).toBe(65);', 'expect(fullPageScan.rulesRun).toBe(72);'),\n            ],"
          if marker not in text:
              raise SystemExit('baseline replacement marker missing')
          text = text.replace(marker, replacement, 1)

          marker = "tests/document-structure-landmarks.test.ts tests/scan.fixtures.test.ts tests/axe-parity-benchmark.test.ts tests/element-internals-parity.test.ts"
          replacement = marker + " tests/component-scan.test.ts tests/e2e/component-scan.spec.ts"
          if marker not in text:
              raise SystemExit('git add marker missing')
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY
      - name: Commit staging correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-document-structure-229.yml
          git commit -m "Chore(a11y): fix document structure staging baselines"
          git push
