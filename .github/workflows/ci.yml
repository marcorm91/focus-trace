name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: eifinger/actionlint-action@1fc89649be682d16ec5cf65ea16e269eb88d3982 # v1.10.2
        with:
          version: 1.7.12

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap standards snapshots when empty
        shell: bash
        run: |
          if grep -q '"languages": 0' generated/language-subtags.json \
            || grep -q '"active": 0' generated/wcag-catalog.json \
            || grep -q '"obsoleteElements": 0' generated/html-obsolete-catalog.json \
            || grep -q '"sources": 0' generated/standards-sources.json \
            || grep -q '"total": 0' generated/axe-rule-severities.json; then
            npm run standards:sync
          fi
      - run: npm run standards:validate
      - run: npm run axe:validate
      - run: npm run capabilities:validate
      - run: npm run rules:validate
      - run: npm run i18n:validate
      - run: npm run deadcode:validate
      - run: npm run coverage:critical
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:edge
      - run: npm run build:firefox
      - run: npm run validate:builds
      - run: npm run bundle:validate
      - name: Preserve bootstrapped standards registries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standards-registries
          path: |
            generated/act-catalog.json
            generated/aria-registry.json
            generated/axe-rule-severities.json
            generated/language-subtags.json
            generated/wcag-catalog.json
            generated/html-obsolete-catalog.json
            generated/standards-sources.json
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:e2e
      - name: Install Chromium for extension E2E
        run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
