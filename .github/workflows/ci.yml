name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap IANA language snapshot when empty
        shell: bash
        run: |
          if grep -q '"languages": 0' generated/language-subtags.json; then
            npm run language:sync
          fi
      - run: npm run standards:validate
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:edge
      - run: npm run build:firefox
      - run: npm run validate:builds
      - name: Preserve bootstrapped language registry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: language-subtags
          path: generated/language-subtags.json
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:e2e
      - name: Install Chromium for extension E2E
        run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
