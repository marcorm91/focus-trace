name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bootstrap IANA language snapshot when empty
        shell: bash
        run: |
          if grep -q '"languages": 0' generated/language-subtags.json; then
            npm run language:sync
          fi
      - run: npm run standards:validate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Preserve bootstrapped language registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-subtags
          path: generated/language-subtags.json
          if-no-files-found: error
          retention-days: 1
