name: CI

on:
  push:
    branches: [main]
  pull_request:

# Temporary write access on this branch is used only to bootstrap package-lock.json
# from a clean runner. The final state of this PR restores contents: read.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Commit generated dependency lock once
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/reproducible-release-builds'
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock release dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Bootstrap IANA language snapshot when empty
        shell: bash
        run: |
          if grep -q '"languages": 0' generated/language-subtags.json; then
            npm run language:sync
          fi
      - run: npm run standards:validate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:edge
      - name: Preserve bootstrapped language registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-subtags
          path: generated/language-subtags.json
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:e2e
      - name: Install Chromium for extension E2E
        run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
