name: Temporary table baseline 231

on:
  push:
    branches: [feat/table-header-relationships-0.4.2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Update fixture baseline
        run: sed -i "s/expect(result.rulesRun).toBe(72);/expect(result.rulesRun).toBe(78);/" tests/scan.fixtures.test.ts
      - run: npx vitest run tests/scan.fixtures.test.ts --exclude 'tests/e2e/**'
      - name: Commit baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/scan.fixtures.test.ts
          git diff --cached --quiet || git commit -m 'Test(a11y): align table scan rule baseline'
          git push
