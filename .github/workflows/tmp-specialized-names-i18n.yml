name: Temporary specialized-name i18n patch

on:
  push:
    branches:
      - feat/specialized-accessible-names-0.3.1

permissions:
  contents: write

jobs:
  patch-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/specialized-accessible-names-0.3.1
          fetch-depth: 1

      - name: Apply bounded translation edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'shared/i18n-base.ts';
          let text = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              "  'FT-WCAG-012': 'Pointer target size and spacing',\n};",
              "  'FT-WCAG-012': 'Pointer target size and spacing',\n  'FT-WCAG-014': 'Specialized interactive control has a non-empty accessible name',\n  'FT-WCAG-015': 'Meter or progress indicator has a non-empty accessible name',\n};"
            ],
            [
              "  'FT-WCAG-012': 'Tamaño y separación de objetivos de puntero',\n  'FT-WARN-001':",
              "  'FT-WCAG-012': 'Tamaño y separación de objetivos de puntero',\n  'FT-WCAG-014': 'El control interactivo especializado tiene un nombre accesible no vacío',\n  'FT-WCAG-015': 'El medidor o indicador de progreso tiene un nombre accesible no vacío',\n  'FT-WARN-022': 'El diálogo ARIA o elemento de árbol no tiene un nombre accesible utilizable',\n  'FT-WARN-001':"
            ],
            [
              "  'FT-WCAG-012': {\n    description: 'Este objetivo de puntero no tiene un área de 24 × 24 CSS px verificada de forma determinista y su círculo de separación de 24 CSS px interseca con otro objetivo observado. Revisa las excepciones de WCAG antes de tratarlo como un incumplimiento.',\n  },\n  'FT-WARN-001':",
              "  'FT-WCAG-012': {\n    description: 'Este objetivo de puntero no tiene un área de 24 × 24 CSS px verificada de forma determinista y su círculo de separación de 24 CSS px interseca con otro objetivo observado. Revisa las excepciones de WCAG antes de tratarlo como un incumplimiento.',\n  },\n  'FT-WCAG-014': {\n    description: 'Este control especializado expuesto tiene un nombre accesible vacío, por lo que las tecnologías de asistencia no pueden identificar de forma fiable qué representa.',\n  },\n  'FT-WCAG-015': {\n    description: 'Este medidor o indicador de progreso expuesto tiene un nombre accesible vacío, por lo que el valor puede quedar expuesto sin identificar qué representa.',\n  },\n  'FT-WARN-022': {\n    description: 'Este diálogo ARIA o elemento de árbol expuesto no tiene un nombre accesible utilizable. Corrige la autoría semántica para que el componente pueda identificarse mediante tecnologías de asistencia.',\n  },\n  'FT-WARN-001':"
            ],
            [
              "  if (issue.ruleId === 'FT-WARN-001') {\n    return issue.evidence.replace('; deprecated since ARIA ', '; obsoleto desde ARIA ');\n  }",
              "  if (['FT-WCAG-014', 'FT-WCAG-015', 'FT-WARN-022'].includes(issue.ruleId)) {\n    return issue.evidence\n      .replace(/^(.+) accessible name = (.+); source = (.+)\\.$/, '$1: nombre accesible = $2; fuente = $3.')\n      .replace(/^(.+) accessible-name computation returned an empty string\\.$/, 'El cálculo del nombre accesible de $1 devolvió una cadena vacía.');\n  }\n  if (issue.ruleId === 'FT-WARN-001') {\n    return issue.evidence.replace('; deprecated since ARIA ', '; obsoleto desde ARIA ');\n  }"
            ],
          ];

          for (const [needle, replacement] of replacements) {
            if (!text.includes(needle)) throw new Error(`Expected i18n text not found: ${needle.slice(0, 100)}`);
            text = text.replace(needle, replacement);
          }

          fs.writeFileSync(path, text);
          fs.unlinkSync('.github/workflows/tmp-specialized-names-i18n.yml');
          NODE

      - name: Commit translations and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/i18n-base.ts .github/workflows/tmp-specialized-names-i18n.yml
          git commit -m "I18n(a11y): localize specialized accessible names"
          git push origin HEAD:feat/specialized-accessible-names-0.3.1
