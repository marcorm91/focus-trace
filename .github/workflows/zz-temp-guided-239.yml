name: Temporary guided 0.6.1 docs sync

on:
  push:
    branches:
      - feat/guided-keyboard-focus-dialog-0.6.1
    paths:
      - .github/workflows/zz-temp-guided-239.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-keyboard-focus-dialog-0.6.1
      - name: Sync public guided-test documentation
        run: |
          node tools/patch-guided-239.mjs
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/zz-temp-guided-239.yml tools/patch-guided-239.mjs
          git add README.md README.es.md docs/RULES.md docs/GUIDED_TESTS.md
          git commit -m "Docs(guided): document keyboard focus and dialog workflows"
          git push origin HEAD:feat/guided-keyboard-focus-dialog-0.6.1
