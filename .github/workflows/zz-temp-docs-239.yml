name: Temporary guided 239 docs sync

on:
  push:
    branches:
      - feat/guided-keyboard-focus-dialog-tests-0.6.1
    paths:
      - .github/workflows/zz-temp-docs-239.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-keyboard-focus-dialog-tests-0.6.1
      - name: Append public documentation and remove helper
        shell: bash
        run: |
          printf '\n' >> README.md
          echo '' | base64 -d >> README.md
          printf '\n' >> README.es.md
          echo '' | base64 -d >> README.es.md
          printf '\n' >> docs/RULES.md
          echo '' | base64 -d >> docs/RULES.md
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/zz-temp-docs-239.yml
          git add README.md README.es.md docs/RULES.md
          git commit -m "Docs(guided): document keyboard focus and dialog workflows"
          git push origin HEAD:feat/guided-keyboard-focus-dialog-tests-0.6.1
