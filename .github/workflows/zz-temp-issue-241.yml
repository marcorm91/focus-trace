name: Temp issue 241 patch

on:
  push:
    branches:
      - feat/guided-apg-widget-patterns-0.6.3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-apg-widget-patterns-0.6.3
      - name: Apply APG guided UI and docs patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('entrypoints/sidepanel/components/GuidedTestPanel.tsx')
          text = panel.read_text()
          text = text.replace(
            "import { ALL_GUIDED_TESTS } from '../../../lib/guided-tests/all-catalog';\n",
            "import { ALL_GUIDED_TESTS } from '../../../lib/guided-tests/all-catalog';\nimport { guidedApgPatternMetadata, isInformativeApgGuidedTest } from '../../../lib/guided-tests/apg-catalog';\n",
          )
          text = text.replace(
            "  const [session, setSession] = useState<GuidedTestSession>();\n  const [loading, setLoading] = useState(false);\n",
            "  const apgMetadata = guidedApgPatternMetadata(definition.id);\n  const informativeApg = isInformativeApgGuidedTest(definition.id);\n  const [session, setSession] = useState<GuidedTestSession>();\n  const [selectedVariationId, setSelectedVariationId] = useState('');\n  const [loading, setLoading] = useState(false);\n",
          )
          text = text.replace(
            "  useEffect(() => {\n    let active = true;\n",
            "  useEffect(() => {\n    setSelectedVariationId(guidedApgPatternMetadata(definition.id)?.variations[0]?.id ?? '');\n  }, [definition.id]);\n\n  useEffect(() => {\n    let active = true;\n",
            1,
          )
          text = text.replace(
            "  const stepCriteria = step ? guidedStepCriteria(definition.id, step.id) : [];\n",
            "  const stepCriteria = step ? guidedStepCriteria(definition.id, step.id) : [];\n  const recordedVariationId = session?.steps[0]?.evidence.find((evidence) => evidence.label === 'APG implementation variation')?.value;\n  const effectiveVariationId = recordedVariationId || selectedVariationId || apgMetadata?.variations[0]?.id;\n  const effectiveVariation = apgMetadata?.variations.find((variation) => variation.id === effectiveVariationId);\n",
          )
          text = text.replace(
            "  const start = async () => {\n    if (!pageUrl) return;\n    const next = startGuidedTest(definition, { url: pageUrl, title: pageTitle });\n    await persist(next, tr(language, 'Guided test started.', 'Prueba guiada iniciada.'));\n  };\n",
            "  const start = async () => {\n    if (!pageUrl) return;\n    const now = Date.now();\n    let next = startGuidedTest(definition, { url: pageUrl, title: pageTitle }, now);\n    const variationId = selectedVariationId || apgMetadata?.variations[0]?.id;\n    if (apgMetadata && variationId) {\n      next = appendGuidedEvidence(next, [{\n        kind: 'manual-note',\n        label: 'APG implementation variation',\n        value: variationId,\n        capturedAt: now,\n      }], now);\n    }\n    await persist(next, tr(language, 'Guided test started.', 'Prueba guiada iniciada.'));\n  };\n",
          )
          text = text.replace(
            "  const referenceBadge = definition.references\n    .filter((reference) => reference.type === 'WCAG')\n    .map((reference) => `WCAG ${reference.id}`)\n    .join(' · ');\n",
            "  const wcagBadge = definition.references\n    .filter((reference) => reference.type === 'WCAG')\n    .map((reference) => `WCAG ${reference.id}`)\n    .join(' · ');\n  const apgBadge = definition.references\n    .filter((reference) => reference.type === 'WAI-ARIA APG')\n    .map((reference) => `APG ${reference.id}`)\n    .join(' · ');\n  const referenceBadge = wcagBadge || apgBadge;\n",
          )
          text = text.replace(
            "          <span className=\"report-kicker\">{tr(language, 'Guided test · manual evidence', 'Prueba guiada · evidencia manual')}</span>\n",
            "          <span className=\"report-kicker\">{informativeApg\n            ? tr(language, 'Guided APG test · informative evidence', 'Prueba guiada APG · evidencia informativa')\n            : tr(language, 'Guided test · manual evidence', 'Prueba guiada · evidencia manual')}</span>\n",
          )
          selector_anchor = """      </label>\n\n      <p>{localText(definition.description, language)}</p>\n"""
          selector_insert = """      </label>\n\n      {apgMetadata && (\n        <label className=\"guided-test-selector\">\n          <span>{tr(language, 'Implementation variation', 'Variante de implementación')}</span>\n          <select\n            value={selectedVariationId || apgMetadata.variations[0]?.id || ''}\n            disabled={session?.status === 'active' || session?.status === 'paused'}\n            onChange={(event) => setSelectedVariationId(event.currentTarget.value)}\n          >\n            {apgMetadata.variations.map((variation) => (\n              <option key={variation.id} value={variation.id}>{localText(variation.label, language)}</option>\n            ))}\n          </select>\n        </label>\n      )}\n\n      <p>{localText(definition.description, language)}</p>\n"""
          if selector_anchor not in text:
            raise SystemExit('guided selector anchor not found')
          text = text.replace(selector_anchor, selector_insert, 1)
          boundary_old = """      <p className=\"guided-test-boundary\" role=\"note\">\n        <strong>{tr(language, 'Not an automated conformance result.', 'No es un resultado automático de conformidad.')}</strong>{' '}\n        {tr(\n          language,\n          'Manual answers and, for runtime-aware workflows, observed Trace events are stored as distinct bounded evidence. Runtime observations support review but never decide the result automatically.',\n          'Las respuestas manuales y, en los flujos con soporte runtime, los eventos observados de Trace se guardan como evidencia acotada y diferenciada. Las observaciones runtime apoyan la revisión, pero nunca deciden automáticamente el resultado.',\n        )}\n      </p>\n"""
          boundary_new = """      <p className=\"guided-test-boundary\" role=\"note\">\n        <strong>{informativeApg\n          ? tr(language, 'Informative APG guidance — not a WCAG conformance result.', 'Guía APG informativa — no es un resultado de conformidad WCAG.')\n          : tr(language, 'Not an automated conformance result.', 'No es un resultado automático de conformidad.')}</strong>{' '}\n        {informativeApg\n          ? tr(\n            language,\n            'APG describes expected widget interaction patterns. Record applicability and implementation variation; observed Trace events support the review but do not establish WCAG conformance.',\n            'APG describe patrones esperados de interacción de widgets. Registra aplicabilidad y variante de implementación; los eventos observados de Trace apoyan la revisión, pero no establecen conformidad WCAG.',\n          )\n          : tr(\n            language,\n            'Manual answers and, for runtime-aware workflows, observed Trace events are stored as distinct bounded evidence. Runtime observations support review but never decide the result automatically.',\n            'Las respuestas manuales y, en los flujos con soporte runtime, los eventos observados de Trace se guardan como evidencia acotada y diferenciada. Las observaciones runtime apoyan la revisión, pero nunca deciden automáticamente el resultado.',\n          )}\n      </p>\n"""
          if boundary_old not in text:
            raise SystemExit('guided boundary anchor not found')
          text = text.replace(boundary_old, boundary_new, 1)
          result_anchor = """          <strong>{outcomeLabel(session, language)}</strong>\n          <p>{tr(\n            language,\n            'This is auditor-provided evidence. It remains separate from automated rule totals and should be reviewed with the recorded manual and runtime evidence below.',\n            'Esta evidencia la proporciona el auditor. Permanece separada de los totales automáticos y debe revisarse junto con la evidencia manual y runtime registrada.',\n          )}</p>\n"""
          result_replacement = """          <strong>{outcomeLabel(session, language)}</strong>\n          {informativeApg ? (\n            <p>{tr(\n              language,\n              'APG guidance remains informative. This implementation review is separate from WCAG conformance and automated rule totals.',\n              'La guía APG sigue siendo informativa. Esta revisión de implementación permanece separada de la conformidad WCAG y de los totales automáticos.',\n            )}</p>\n          ) : (\n            <p>{tr(\n              language,\n              'This is auditor-provided evidence. It remains separate from automated rule totals and should be reviewed with the recorded manual and runtime evidence below.',\n              'Esta evidencia la proporciona el auditor. Permanece separada de los totales automáticos y debe revisarse junto con la evidencia manual y runtime registrada.',\n            )}</p>\n          )}\n          {effectiveVariation && (\n            <p><strong>{tr(language, 'Implementation variation', 'Variante de implementación')}:</strong>{' '}{localText(effectiveVariation.label, language)}</p>\n          )}\n"""
          if result_anchor not in text:
            raise SystemExit('guided result anchor not found')
          text = text.replace(result_anchor, result_replacement, 1)
          active_anchor = """          {stepCriteria.length > 0 && (\n            <p className=\"guided-test-criteria\">\n              <strong>{tr(language, 'Evidence maps to', 'La evidencia se vincula a')}:</strong>{' '}\n              {stepCriteria.map((criterion) => `WCAG ${criterion}`).join(' · ')}\n            </p>\n          )}\n          {hasGuidedRuntimeEvidence(definition.id) && (\n            <p className=\"guided-test-runtime-hint\">\n              {tr(\n                language,\n                'Keep Trace recording while you perform this step. Relevant focus, keyboard and dialog events will be attached when you save it.',\n                'Mantén Trace grabando mientras realizas este paso. Los eventos relevantes de foco, teclado y diálogo se adjuntarán al guardarlo.',\n              )}\n            </p>\n          )}\n"""
          active_replacement = """          {stepCriteria.length > 0 && (\n            <p className=\"guided-test-criteria\">\n              <strong>{tr(language, 'Evidence maps to', 'La evidencia se vincula a')}:</strong>{' '}\n              {stepCriteria.map((criterion) => `WCAG ${criterion}`).join(' · ')}\n            </p>\n          )}\n          {effectiveVariation && (\n            <p className=\"guided-test-criteria\">\n              <strong>{tr(language, 'Implementation variation', 'Variante de implementación')}:</strong>{' '}{localText(effectiveVariation.label, language)}\n            </p>\n          )}\n          {hasGuidedRuntimeEvidence(definition.id) && (\n            <p className=\"guided-test-runtime-hint\">\n              {informativeApg\n                ? tr(\n                  language,\n                  'Keep Trace recording while you perform this step. Relevant widget-pattern observations will be attached when you save it; they support the APG review but never decide it automatically.',\n                  'Mantén Trace grabando mientras realizas este paso. Las observaciones relevantes del patrón de widget se adjuntarán al guardarlo; apoyan la revisión APG, pero nunca la deciden automáticamente.',\n                )\n                : tr(\n                  language,\n                  'Keep Trace recording while you perform this step. Relevant focus, keyboard and dialog events will be attached when you save it.',\n                  'Mantén Trace grabando mientras realizas este paso. Los eventos relevantes de foco, teclado y diálogo se adjuntarán al guardarlo.',\n                )}\n            </p>\n          )}\n"""
          if active_anchor not in text:
            raise SystemExit('guided active anchor not found')
          text = text.replace(active_anchor, active_replacement, 1)
          panel.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          if '### Guided APG widget-pattern tests' not in text:
            text += """\n\n### Guided APG widget-pattern tests\n\n`FT-GUIDED-009` through `FT-GUIDED-016` turn the existing runtime/APG observations into repeatable manual workflows for tabs, accordion/disclosure, menu, combobox/listbox, tree, grid, carousel and tooltip patterns. Keyboard instructions are localized in English and Spanish and each workflow records whether the pattern applies plus the selected implementation variation.\n\nThese results are labelled **informative APG guidance** in Report. APG describes recommended widget interaction patterns; a guided APG issue is not a WCAG conformance failure and does not change automated PASS/FAIL/REVIEW/WARNING or axe-core parity counts. Relevant Trace observations are filtered to the pattern being reviewed and remain supporting evidence only.\n\nThe browser test suite includes accessible, failure and review fixtures for every supported APG pattern. All evidence remains local and bounded; the feature adds no browser permissions or inspected-page transmission.\n"""
            readme.write_text(text)

          readme_es = Path('README.es.md')
          text = readme_es.read_text()
          if '### Pruebas guiadas de patrones APG' not in text:
            text += """\n\n### Pruebas guiadas de patrones APG\n\n`FT-GUIDED-009` a `FT-GUIDED-016` convierten las observaciones runtime/APG existentes en flujos manuales repetibles para tabs, acordeón/disclosure, menú, combobox/listbox, tree, grid, carousel y tooltip. Las instrucciones de teclado están localizadas en inglés y español y cada flujo registra si el patrón aplica y la variante de implementación seleccionada.\n\nEstos resultados se etiquetan como **guía APG informativa** en Report. APG describe patrones recomendados de interacción de widgets; un problema guiado APG no es un fallo de conformidad WCAG y no modifica los recuentos automáticos PASS/FAIL/REVIEW/WARNING ni la paridad con axe-core. Las observaciones relevantes de Trace se filtran al patrón revisado y siguen siendo solo evidencia de apoyo.\n\nLa suite de navegador incluye fixtures accesibles, de fallo y de review para cada patrón APG compatible. Toda la evidencia permanece local y acotada; la funcionalidad no añade permisos de navegador ni transmisión de datos de la página inspeccionada.\n"""
            readme_es.write_text(text)

          rules = Path('docs/RULES.md')
          text = rules.read_text()
          if '## Guided APG widget-pattern evidence' not in text:
            text += """\n\n## Guided APG widget-pattern evidence\n\n`FT-GUIDED-009` through `FT-GUIDED-016` cover tabs, accordion/disclosure, menu, combobox/listbox, tree, grid, carousel and tooltip interaction patterns as **informative APG guidance**. The workflows record applicability, an implementation variation and localized keyboard/focus/state-change judgement. APG references are informative and do not convert a manual outcome into a WCAG conformance result.\n\nWhere FocusTrace already observes relevant runtime behavior, guided evidence reuses that stream with pattern-specific filtering. Tabs reuse tab activation findings; disclosure reuses expanded-state evidence; menu reuses open-focus/Escape observations; combobox/listbox, tree and grid reuse active-descendant, selection, roving-tabindex and arrow-navigation observations. Carousel and tooltip retain bounded keyboard/focus/change observations. Runtime evidence can support a manual conclusion but never selects the answer automatically.\n\nThe acceptance fixture catalog contains accessible, failure and review/variation scenarios for all eight patterns. These fixtures are test-only and are not shipped as an APG conformance engine. Machine-readable guided declarations remain `coverage: \"guided-manual\"`, `automated: false`, with the APG set additionally marked `guidance: \"apg-informative\"`.\n"""
            rules.write_text(text)

          guided = Path('docs/GUIDED_TESTS.md')
          text = guided.read_text()
          anchor = '## Reporting and standards coverage\n'
          if '## APG widget-pattern workflows' not in text:
            section = """## APG widget-pattern workflows\n\n`FT-GUIDED-009` through `FT-GUIDED-016` cover tabs, accordion/disclosure, menu, combobox/listbox, tree, grid, carousel and tooltip. They are explicitly labelled **informative APG guidance** because WAI-ARIA APG interaction patterns support implementation review but are not, by themselves, WCAG conformance outcomes.\n\nEach APG workflow asks the auditor to confirm applicability and select an implementation variation before the run. The selected variation is persisted as bounded manual evidence so repeated reviews can distinguish, for example, manual versus automatic tab activation, single versus multi-select widgets, or automatic versus manual carousel rotation.\n\nRelevant Trace evidence is reused conservatively. `aria-widget` observations are filtered by the rule IDs associated with the selected pattern, while bounded keyboard/focus/virtual-focus/change evidence can support patterns that do not have a dedicated runtime rule. The runtime stream never chooses a guided answer automatically.\n\nBrowser acceptance fixtures provide accessible, failure and review/variation scenarios for all eight supported patterns. They exist to keep the guided instructions and expected interaction branches testable without claiming an automated APG conformance engine.\n\n"""
            if anchor not in text:
              raise SystemExit('GUIDED_TESTS reporting anchor not found')
            text = text.replace(anchor, section + anchor, 1)
            guided.write_text(text)
          PY
          rm .github/workflows/zz-temp-issue-241.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Feat(guided): label APG guidance and document patterns"
          git push origin HEAD:feat/guided-apg-widget-patterns-0.6.3
