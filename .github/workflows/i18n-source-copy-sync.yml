name: I18n source-copy sync

on:
  push:
    branches:
      - feat/memory-visual-evidence
    paths:
      - .github/workflows/i18n-source-copy-sync.yml

permissions:
  contents: write

jobs:
  sync-surfaces:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/memory-visual-evidence
      - name: Use localized finding references on Site Audit surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('entrypoints/site-audit/main.tsx'): [
                  ('{finding.references.length > 0 && (', '{issue.references.length > 0 && ('),
                  ('<ul>{finding.references.map((reference) => (', '<ul>{issue.references.map((reference) => ('),
              ],
              Path('lib/site-audit/text-report.ts'): [
                  ('if (finding.references.length) {', 'if (issue.references.length) {'),
                  ('finding.references.forEach((reference) => {', 'issue.references.forEach((reference) => {'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit localized surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/site-audit/main.tsx lib/site-audit/text-report.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: localize Site Audit standard references"
          git push origin HEAD:feat/memory-visual-evidence
