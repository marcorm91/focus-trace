name: Temporary issue 236 integration

on:
  push:
    branches:
      - feat/shadow-frame-traversal-0.5.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, 'integrate composed audit contexts') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/shadow-frame-traversal-0.5.0
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply composed traversal integration
        run: |
          node tools/patch-issue-236.mjs
          node tools/patch-issue-236-hardening.mjs
          git rm tools/patch-issue-236.mjs tools/patch-issue-236-hardening.mjs .github/workflows/zz-temp-issue-236.yml
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git add -A
          git commit -m "Feat(a11y): integrate composed audit contexts"
          git push origin HEAD:feat/shadow-frame-traversal-0.5.0
