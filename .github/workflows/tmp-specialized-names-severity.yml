name: Temporary specialized-name severity documentation

on:
  push:
    branches:
      - feat/specialized-accessible-names-0.3.1

permissions:
  contents: write

jobs:
  patch-severity-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/specialized-accessible-names-0.3.1
          fetch-depth: 1
      - name: Apply bounded severity-audit edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/SEVERITY-AUDIT.md';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '| `FT-WARN-018` Missing/incompatible required ARIA children | serious | **critical** | axe `aria-required-children` is critical. |',
              '| `FT-WARN-018` Incompatible ARIA child role | serious | **critical** | FocusTrace-owned WAI-ARIA allowed-child-role contradiction detector. It is not equivalent to axe `aria-required-children`, which checks mandatory owned-child presence. |'
            ],
            [
              '| `FT-WCAG-013` Language of Parts | serious | fail | Aligned with axe `valid-lang`. FocusTrace validates the observable explicit-`lang` subset and does not infer missing language changes from prose. |\n| `FT-WARN-001` Deprecated ARIA role',
              '| `FT-WCAG-013` Language of Parts | serious | fail | Aligned with axe `valid-lang`. FocusTrace validates the observable explicit-`lang` subset and does not infer missing language changes from prose. |\n| `FT-WCAG-014` Specialized control name | serious | fail | Covers exposed tab, tooltip and native summary naming. The targeted axe rules are serious, but FocusTrace records only `partial` parity because its local AccName implementation is deliberately bounded. |\n| `FT-WCAG-015` Meter/progress name | serious | fail | Covers native/ARIA meter and progressbar naming. The targeted axe rules are serious; parity remains `partial` for the bounded local AccName implementation. |\n| `FT-WARN-001` Deprecated ARIA role'
            ],
            [
              '| `FT-WARN-021` Relationship/state contradiction | serious | FocusTrace-specific consistency detector |\n\n## Guardrails',
              '| `FT-WARN-021` Relationship/state contradiction | serious | FocusTrace-specific consistency detector |\n| `FT-WARN-022` Dialog/treeitem accessible name | serious | `aria-dialog-name` / `aria-treeitem-name` · serious benchmark impact, retained as WARNING because both benchmark rules are best-practice rather than automatic WCAG failures |\n\n## Guardrails'
            ],
            [
              '| `FT-WARN-018` Required/incompatible ARIA children | critical | `aria-required-children` · critical |',
              '| `FT-WARN-018` Incompatible ARIA child role | critical | FocusTrace-specific WAI-ARIA allowed-child-role detector; no direct axe equivalence |'
            ],
          ];
          for (const [needle, replacement] of replacements) {
            if (!text.includes(needle)) throw new Error(`Expected severity text not found: ${needle.slice(0, 120)}`);
            text = text.replace(needle, replacement);
          }
          fs.writeFileSync(path, text);
          fs.unlinkSync('.github/workflows/tmp-specialized-names-severity.yml');
          NODE
      - name: Commit severity documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SEVERITY-AUDIT.md .github/workflows/tmp-specialized-names-severity.yml
          git commit -m "Docs(audit): document specialized-name severities"
          git push origin HEAD:feat/specialized-accessible-names-0.3.1
