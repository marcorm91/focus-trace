name: Report accordion transform

on:
  push:
    branches:
      - feat/multipage-audit-report
    paths:
      - .github/workflows/report-accordion-transform.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/multipage-audit-report
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Convert report sections to native accordions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'entrypoints/sidepanel/views/SessionReportView.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(before, after, label) {
            const index = source.indexOf(before);
            if (index < 0) throw new Error(`Could not find ${label}`);
            if (source.indexOf(before, index + before.length) >= 0) {
              throw new Error(`Expected one occurrence for ${label}`);
            }
            source = source.slice(0, index) + after + source.slice(index + before.length);
          }

          replaceOnce(
            '          <section className="report-section report-priority" aria-labelledby="report-priority-title">',
            `          <details className="report-section report-accordion-section report-priority" open>\n            <summary className="report-accordion-summary">\n              <span className="report-section-index">!</span>\n              <span className="report-accordion-summary-copy">\n                <strong>{tr(language, 'Highest priority', 'Máxima prioridad')}</strong>\n                <small>{highPriority.length} {tr(language, 'priority suggestions', 'sugerencias prioritarias')}</small>\n              </span>\n            </summary>`,
            'priority section',
          );

          replaceOnce(
            '          </section>\n\n          <section className="report-section report-trace-section" aria-labelledby="report-trace-title">',
            `          </details>\n\n          <details className="report-section report-accordion-section report-trace-section">\n            <summary className="report-accordion-summary">\n              <span className="report-section-index">01</span>\n              <span className="report-accordion-summary-copy">\n                <strong>{tr(language, 'Runtime trace', 'Traza runtime')}</strong>\n                <small>{model.runtimeFindings} {tr(language, 'findings', 'hallazgos')} · {model.focusSteps} {tr(language, 'focus steps', 'pasos de foco')}</small>\n              </span>\n            </summary>`,
            'trace section boundary',
          );

          replaceOnce(
            '          </section>\n\n          <section className="report-section" aria-labelledby="report-analysis-title">',
            `          </details>\n\n          <details className="report-section report-accordion-section">\n            <summary className="report-accordion-summary">\n              <span className="report-section-index">02</span>\n              <span className="report-accordion-summary-copy">\n                <strong>{tr(language, 'Full page scan', 'Barrido completo de página')}</strong>\n                <small>{model.failures} {tr(language, 'failures', 'fallos')} · {model.reviews} {tr(language, 'reviews', 'revisiones')}</small>\n              </span>\n            </summary>`,
            'analysis section boundary',
          );

          replaceOnce(
            '          </section>\n\n          <section className="report-section" aria-labelledby="report-structure-title">',
            `          </details>\n\n          <details className="report-section report-accordion-section">\n            <summary className="report-accordion-summary">\n              <span className="report-section-index">03</span>\n              <span className="report-accordion-summary-copy">\n                <strong>{tr(language, 'Document structure', 'Estructura del documento')}</strong>\n                <small>{componentScope ? tr(language, 'Component scope', 'Alcance de componente') : \`${'${'}structureReviewCount} ${'${'}tr(language, 'to review', 'a revisar')}\`}</small>\n              </span>\n            </summary>`,
            'structure section boundary',
          );

          replaceOnce(
            '          </section>\n\n          <section className="report-section report-recommendations" aria-labelledby="report-suggestions-title">',
            `          </details>\n\n          <details className="report-section report-accordion-section report-recommendations">\n            <summary className="report-accordion-summary">\n              <span className="report-section-index">04</span>\n              <span className="report-accordion-summary-copy">\n                <strong>{tr(language, 'Recommended next steps', 'Sugerencias de mejora')}</strong>\n                <small>{model.suggestions.length} {tr(language, 'suggestions', 'sugerencias')}</small>\n              </span>\n            </summary>`,
            'recommendations section boundary',
          );

          replaceOnce(
            '          </section>\n\n          <p className="report-scope-note">',
            '          </details>\n\n          <p className="report-scope-note">',
            'recommendations closing boundary',
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Verify transformed report
        run: |
          grep -q '<details className="report-section report-accordion-section report-priority" open>' entrypoints/sidepanel/views/SessionReportView.tsx
          test "$(grep -c 'report-accordion-summary' entrypoints/sidepanel/views/SessionReportView.tsx)" -eq 5
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit transformed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/sidepanel/views/SessionReportView.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: collapse report sections by default"
          git push origin HEAD:feat/multipage-audit-report
