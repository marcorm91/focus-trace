name: Temporary guided docs sync

on:
  push:
    branches:
      - feat/guided-test-framework-0.6.0
    paths:
      - .github/workflows/zz-temp-docs-238.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-test-framework-0.6.0
      - name: Append guided-test documentation and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          additions = {
              'README.md': r'''

### Guided accessibility tests

FocusTrace now includes a reusable framework for checks that require user action or contextual judgement. Guided tests live in the Report workspace and are explicitly labelled **Guided test · manual evidence** so their outcomes cannot be confused with automated PASS/FAIL counts.

A guided definition contains localized steps and prompts, allowed manual answers, bounded captured evidence and a completion outcome. Sessions can be paused, resumed, cancelled and restarted. Interrupted progress is kept locally in bounded `browser.storage.session` state: at most 8 sessions, 20 steps per session, 4 evidence records per step and 240 characters per auditor note.

The framework never reads form values automatically. Stored page context drops query strings and fragments, and common sensitive patterns in free-text notes are redacted before persistence. Guided outcomes are `guided-pass`, `guided-issue`, `guided-review` or `not-applicable`; all remain auditor-provided evidence and **never become automated conformance claims**.

`FT-GUIDED-001` is the sample end-to-end workflow for WCAG 1.3.3 Sensory Characteristics. It asks the auditor to review page instructions and decide whether meaning relies only on color, shape, size, visual position, orientation or sound. See [`docs/GUIDED_TESTS.md`](docs/GUIDED_TESTS.md) for the lifecycle, privacy boundaries and reporting model.
''',
              'README.es.md': r'''

### Pruebas guiadas de accesibilidad

FocusTrace incluye ahora un framework reutilizable para comprobaciones que requieren acciones del usuario o criterio contextual. Las pruebas guiadas aparecen en el Informe y se etiquetan explícitamente como **Prueba guiada · evidencia manual** para que sus resultados no puedan confundirse con los recuentos automáticos PASS/FAIL.

Una definición guiada contiene pasos y prompts localizados, respuestas manuales permitidas, evidencia capturada de forma acotada y un resultado de finalización. Las sesiones pueden pausarse, reanudarse, cancelarse y reiniciarse. El progreso interrumpido se conserva localmente en un estado acotado de `browser.storage.session`: como máximo 8 sesiones, 20 pasos por sesión, 4 registros de evidencia por paso y 240 caracteres por nota del auditor.

El framework nunca lee automáticamente valores de formularios. El contexto de página guardado elimina query strings y fragmentos, y los patrones sensibles habituales de las notas libres se redactan antes de persistir. Los resultados guiados son `guided-pass`, `guided-issue`, `guided-review` o `not-applicable`; todos siguen siendo evidencia aportada por el auditor y **nunca se convierten en afirmaciones automáticas de conformidad**.

`FT-GUIDED-001` es el flujo completo de muestra para WCAG 1.3.3 Características sensoriales. Pide al auditor revisar las instrucciones de la página y decidir si el significado depende únicamente de color, forma, tamaño, posición visual, orientación o sonido. Consulta [`docs/GUIDED_TESTS.md`](docs/GUIDED_TESTS.md) para el ciclo de vida, los límites de privacidad y el modelo de informes.
''',
              'docs/RULES.md': r'''

## Guided/manual test methodology

Guided tests are a separate evidence workflow for accessibility questions that cannot be represented responsibly as a fully automated rule. Definitions provide localized steps/prompts, an explicit manual-answer vocabulary and bounded evidence. The framework supports pause, resume, cancel and restart, and validates recovered session state before reuse.

Guided state is stored locally in `browser.storage.session` with explicit limits: 8 retained sessions, 20 steps per session, 4 evidence records per step and 240 characters per free-text note. Page context removes query strings and fragments. The framework never reads editable form values automatically, while free-text notes apply defensive redaction for common email, long-number and secret/token/password-like assignment patterns before persistence.

Completion produces `guided-pass`, `guided-issue`, `guided-review` or `not-applicable`. These values are **manual auditor evidence**. They are excluded from automated PASS/FAIL/REVIEW/WARNING totals and cannot establish automated conformance with the referenced WCAG criterion. Machine-readable declarations live in `config/guided-tests.json` with `coverage: "guided-manual"` and `automated: false`, separate from the axe-core parity benchmark.

`FT-GUIDED-001` is the framework sample for WCAG 1.3.3 Sensory Characteristics (Level A). It guides the auditor through relevant instructions and asks for contextual judgement about reliance on shape, color, size, visual position, orientation or sound. The sample demonstrates the full workflow without pretending natural-language/context judgement is deterministic. See [`GUIDED_TESTS.md`](GUIDED_TESTS.md) for the full lifecycle and privacy model.
''',
          }

          for filename, addition in additions.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = addition.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/zz-temp-docs-238.yml
          git add README.md README.es.md docs/RULES.md
          git commit -m "Docs(guided): document guided framework publicly"
          git push origin HEAD:feat/guided-test-framework-0.6.0
