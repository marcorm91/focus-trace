name: Temporary guided docs sync

on:
  push:
    branches:
      - feat/guided-test-framework-0.6.0
    paths:
      - .github/workflows/zz-temp-docs-238.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOC_EN: ""
      DOC_ES: ""
      DOC_RULES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-test-framework-0.6.0
      - name: Append guided-test documentation and remove helper
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          additions = {
              'README.md': ('### Guided accessibility tests', os.environ['DOC_EN']),
              'README.es.md': ('### Pruebas guiadas de accesibilidad', os.environ['DOC_ES']),
              'docs/RULES.md': ('## Guided/manual test methodology', os.environ['DOC_RULES']),
          }
          for filename, (marker, payload) in additions.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  addition = base64.b64decode(payload).decode('utf-8')
                  path.write_text(text.rstrip() + '\n\n' + addition, encoding='utf-8')
          PY
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/zz-temp-docs-238.yml
          git add README.md README.es.md docs/RULES.md
          git commit -m "Docs(guided): document guided framework publicly"
          git push origin HEAD:feat/guided-test-framework-0.6.0
