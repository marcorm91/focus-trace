name: Sync release lockfile

on:
  push:
    branches:
      - release/v0.1.2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.1.2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Restore lockfile and sync release version
        run: |
          git show origin/main:package-lock.json > package-lock.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          lock.version = '0.1.2';
          lock.packages[''].version = '0.1.2';
          writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync lockfile version to 0.1.2"
          git push origin HEAD:release/v0.1.2
