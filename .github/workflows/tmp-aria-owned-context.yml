name: Temporary ARIA owned-context refinement

on:
  push:
    branches:
      - feat/aria-role-state-relationships-0.3.3
    paths:
      - .github/workflows/tmp-aria-owned-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aria-role-state-relationships-0.3.3
      - name: Reuse accessibility ownership for conditional context
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('lib/audit/aria-validator.ts')
          text = validator.read_text()
          marker = '''function activeDescendantSignal(element: Element, model: OwnershipModel): AriaValidationSignal | null {'''
          helper = '''export function hasAccessibilityAncestorRole(element: Element, roleName: string): boolean {
            const model = buildOwnershipModel();
            let current = semanticParent(element, model);
            const seen = new Set<Element>();
            while (current && !seen.has(current)) {
              if (effectiveAriaRole(current) === roleName) return true;
              seen.add(current);
              current = semanticParent(current, model);
            }
            return false;
          }

          '''
          if 'hasAccessibilityAncestorRole' not in text:
            if marker not in text: raise SystemExit('validator insertion marker missing')
            text = text.replace(marker, helper + marker, 1)
          validator.write_text(text)

          evaluator = Path('lib/audit/aria-role-state-relationships.ts')
          text = evaluator.read_text()
          text = text.replace(
            "import { effectiveAriaRole, resolvedExplicitAriaRole } from './aria-validator';",
            "import { effectiveAriaRole, hasAccessibilityAncestorRole, resolvedExplicitAriaRole } from './aria-validator';",
          )
          start = '''function hasTreegridAncestor(element: Element): boolean {
            let current = element.parentElement;
            while (current) {
              if (effectiveAriaRole(current) === 'treegrid') return true;
              current = current.parentElement;
            }
            return false;
          }

          '''
          text = text.replace(start, '')
          text = text.replace(
            "if (effectiveAriaRole(element) !== 'row' || hasTreegridAncestor(element)) return null;",
            "if (effectiveAriaRole(element) !== 'row' || hasAccessibilityAncestorRole(element, 'treegrid')) return null;",
          )
          evaluator.write_text(text)
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit/aria-validator.ts lib/audit/aria-role-state-relationships.ts
          git commit -m "Fix(aria): resolve conditional context through aria-owns"
          git push
