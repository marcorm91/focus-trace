name: Temporary ARIA capability docs update

on:
  push:
    branches:
      - feat/aria-role-state-relationships-0.3.3
    paths:
      - .github/workflows/tmp-aria-capability-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aria-role-state-relationships-0.3.3
      - name: Update bilingual capability catalogs
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(text, marker, addition, label):
              if addition.strip() in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'{label} marker missing')
              return text.replace(marker, marker + addition, 1)

          path = Path('README.md')
          text = path.read_text()
          text = insert_after(text, '| `FT-WCAG-015` | Exposed native/ARIA meters and progress indicators have a non-empty accessible name. | FAIL / PASS | WCAG 1.1.1 · WAI-ARIA · AccName |\n', '| `FT-WCAG-016` | The top-level document `body` does not declare `aria-hidden="true"`. | FAIL / PASS | WCAG 1.3.1 / 4.1.2 · ARIA in HTML |\n', 'README WCAG')
          text = insert_after(text, '| `FT-REVIEW-028` | A guided comparison between the same page at 100% and 200% browser zoom observes text or controls that disappear, lose their name, become clipped/overlapped or fail to double in effective size. | REVIEW | WCAG 1.4.4 AA |\n', '| `FT-REVIEW-029` | Braille-specific labels or role descriptions lack an observable non-braille accessible-name / `aria-roledescription` counterpart, or `aria-roledescription` has no resolved semantic role. | REVIEW / PASS | WAI-ARIA 1.3 |\n', 'README review')
          text = insert_after(text, '| `FT-WARN-022` | Exposed dialog/alertdialog and treeitem semantics have a usable accessible name. | WARNING / PASS | WAI-ARIA · APG · AccName |\n', '| `FT-WARN-023` | A bounded ARIA in HTML host-role or conditional state/property constraint is violated. | WARNING | ARIA in HTML · WAI-ARIA 1.3 |\n', 'README warning')
          path.write_text(text)

          path = Path('README.es.md')
          text = path.read_text()
          text = insert_after(text, '| `FT-WCAG-015` | Los medidores e indicadores de progreso nativos/ARIA expuestos tienen un nombre accesible no vacío. | FAIL / PASS | WCAG 1.1.1 · WAI-ARIA · AccName |\n', '| `FT-WCAG-016` | El `body` de nivel superior del documento no declara `aria-hidden="true"`. | FAIL / PASS | WCAG 1.3.1 / 4.1.2 · ARIA in HTML |\n', 'README.es WCAG')
          text = insert_after(text, '| `FT-REVIEW-028` | Una comparación guiada de la misma página con zoom del navegador al 100 % y al 200 % observa textos o controles que desaparecen, pierden su nombre, quedan recortados/solapados o no duplican su tamaño efectivo. | REVIEW | WCAG 1.4.4 AA |\n', '| `FT-REVIEW-029` | Las etiquetas o descripciones de rol específicas para braille carecen de una contraparte observable no braille mediante nombre accesible / `aria-roledescription`, o `aria-roledescription` no tiene un rol semántico resuelto. | REVIEW / PASS | WAI-ARIA 1.3 |\n', 'README.es review')
          text = insert_after(text, '| `FT-WARN-022` | Las semánticas expuestas `dialog`/`alertdialog` y `treeitem` tienen un nombre accesible utilizable. | WARNING / PASS | WAI-ARIA · APG · AccName |\n', '| `FT-WARN-023` | Se incumple una restricción acotada de rol del lenguaje host de ARIA in HTML o de estado/propiedad condicional. | WARNING | ARIA in HTML · WAI-ARIA 1.3 |\n', 'README.es warning')
          path.write_text(text)
          PY
      - name: Commit capability docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md
          git commit -m "Docs(a11y): document ARIA role-state capabilities"
          git push
