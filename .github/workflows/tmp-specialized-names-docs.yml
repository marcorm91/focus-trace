name: Temporary specialized-name documentation patch

on:
  push:
    branches:
      - feat/specialized-accessible-names-0.3.1

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/specialized-accessible-names-0.3.1
          fetch-depth: 1

      - name: Apply bounded documentation edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [needle, replacement] of replacements) {
              if (!text.includes(needle)) {
                throw new Error(`${path}: expected text not found: ${needle.slice(0, 120)}`);
              }
              text = text.replace(needle, replacement);
            }
            fs.writeFileSync(path, text);
          }

          edit('README.md', [
            [
              '| `FT-WCAG-013` | Explicit `lang` values on rendered human-language content use a known primary language subtag. Code-like contexts are excluded. | FAIL / PASS | WCAG 3.1.2 AA · ACT de46e4 · IANA |',
              '| `FT-WCAG-013` | Explicit `lang` values on rendered human-language content use a known primary language subtag. Code-like contexts are excluded. | FAIL / PASS | WCAG 3.1.2 AA · ACT de46e4 · IANA |\n| `FT-WCAG-014` | Exposed tabs, tooltips and native summary controls have a non-empty accessible name. | FAIL / PASS | WCAG 4.1.2 · WAI-ARIA · AccName |\n| `FT-WCAG-015` | Exposed native/ARIA meters and progress indicators have a non-empty accessible name. | FAIL / PASS | WCAG 1.1.1 · WAI-ARIA · AccName |'
            ],
            [
              'A PASS therefore means the observed declaration is valid, not that every change of human language on the page has been identified.\n\n### Contextual and structural reviews',
              'A PASS therefore means the observed declaration is valid, not that every change of human language on the page has been identified.\n\n`FT-WCAG-014`, `FT-WCAG-015` and `FT-WARN-022` reuse the same bounded accessible-name evidence model. Tabs, tooltips, treeitems and native `summary` controls can use name-from-content where their semantics allow it; a treeitem excludes descendant `group` content from its own computed content name. Dialogs, meters and progress indicators rely on author-provided naming mechanisms. Programmatically hidden targets are inapplicable, and broken `aria-labelledby` references remain visible in diagnostic candidates instead of being silently repaired.\n\n### Contextual and structural reviews'
            ],
            [
              '| `FT-WARN-021` | An ARIA relationship resolves, but exposed state contradicts the relationship or related content. | WARNING | WAI-ARIA 1.3 |',
              '| `FT-WARN-021` | An ARIA relationship resolves, but exposed state contradicts the relationship or related content. | WARNING | WAI-ARIA 1.3 |\n| `FT-WARN-022` | Exposed dialog/alertdialog and treeitem semantics have a usable accessible name. | WARNING / PASS | WAI-ARIA · APG · AccName |'
            ],
          ]);

          edit('README.es.md', [
            [
              '| `FT-WCAG-013` | Los valores `lang` explícitos de contenido de lenguaje humano renderizado usan un subtag primario de idioma reconocido. Se excluyen contextos con apariencia de código. | FAIL / PASS | WCAG 3.1.2 AA · ACT de46e4 · IANA |',
              '| `FT-WCAG-013` | Los valores `lang` explícitos de contenido de lenguaje humano renderizado usan un subtag primario de idioma reconocido. Se excluyen contextos con apariencia de código. | FAIL / PASS | WCAG 3.1.2 AA · ACT de46e4 · IANA |\n| `FT-WCAG-014` | Las pestañas, tooltips y controles `summary` nativos expuestos tienen un nombre accesible no vacío. | FAIL / PASS | WCAG 4.1.2 · WAI-ARIA · AccName |\n| `FT-WCAG-015` | Los medidores e indicadores de progreso nativos/ARIA expuestos tienen un nombre accesible no vacío. | FAIL / PASS | WCAG 1.1.1 · WAI-ARIA · AccName |'
            ],
            [
              'Un PASS significa por tanto que la declaración observada es válida, no que se hayan identificado todos los cambios de idioma humano de la página.\n\n### Revisiones contextuales y estructurales',
              'Un PASS significa por tanto que la declaración observada es válida, no que se hayan identificado todos los cambios de idioma humano de la página.\n\n`FT-WCAG-014`, `FT-WCAG-015` y `FT-WARN-022` reutilizan el mismo modelo acotado de evidencia de nombre accesible. Las pestañas, tooltips, treeitems y controles `summary` nativos pueden obtener nombre desde el contenido cuando su semántica lo permite; un treeitem excluye de su propio nombre el contenido de un `group` descendiente. Los diálogos, medidores e indicadores de progreso dependen de mecanismos de nombre proporcionados por el autor. Los destinos ocultos programáticamente no son aplicables y las referencias `aria-labelledby` rotas permanecen visibles en los candidatos de diagnóstico en lugar de repararse silenciosamente.\n\n### Revisiones contextuales y estructurales'
            ],
            [
              '| `FT-WARN-021` | Una relación ARIA resuelve, pero el estado expuesto contradice esa relación o el contenido relacionado. | WARNING | WAI-ARIA 1.3 |',
              '| `FT-WARN-021` | Una relación ARIA resuelve, pero el estado expuesto contradice esa relación o el contenido relacionado. | WARNING | WAI-ARIA 1.3 |\n| `FT-WARN-022` | Las semánticas expuestas `dialog`/`alertdialog` y `treeitem` tienen un nombre accesible utilizable. | WARNING / PASS | WAI-ARIA · APG · AccName |'
            ],
          ]);

          edit('docs/RULES.md', [
            [
              'A placeholder-derived name is not reported as an empty-name WCAG failure. FocusTrace emits `FT-REVIEW-003` because a programmatic name and a persistent visible label are separate concerns.\n\n## Label in Name scope',
              'A placeholder-derived name is not reported as an empty-name WCAG failure. FocusTrace emits `FT-REVIEW-003` because a programmatic name and a persistent visible label are separate concerns.\n\n## Specialized accessible names\n\n`FT-WCAG-014` checks exposed `tab`, `tooltip` and native `summary` controls. These semantics can obtain a name from their content where the platform naming rules allow it. A supported target with an empty computed name is a deterministic FAIL for the bounded expectation; a named target records PASS.\n\n`FT-WCAG-015` checks native `meter` / `progress` elements and explicit `role="meter"` / `role="progressbar"` semantics. These range indicators require a usable author-provided name; native `<label>` association, `aria-labelledby` and `aria-label` are accepted by the shared name primitive. Name-from-content is not invented for these roles.\n\n`FT-WARN-022` checks exposed `dialog`, `alertdialog` and `treeitem` semantics. Missing names remain ARIA authoring WARNINGs rather than automatic WCAG failures because the external benchmark classifies these checks as best-practice rules. Dialogs require author-provided naming. Treeitems can obtain a name from content, but FocusTrace excludes descendant `role="group"` subtrees and nested treeitems so child branches do not accidentally name their parent item.\n\nProgrammatically hidden targets are inapplicable to these checks. Broken `aria-labelledby` references remain represented in the accessible-name diagnostic candidates with an empty unresolved value. The implementation remains a deliberately bounded AccName subset: PASS means the supported naming expectation was met, not that FocusTrace reproduced the browser accessibility tree or every AccName edge case.\n\n## Label in Name scope'
            ],
          ]);

          edit('docs/AXE_CORE_PARITY_AUDIT.md', [
            ['| Partial | 23 |', '| Partial | 30 |'],
            ['| Missing | 45 |', '| Missing | 38 |'],
            ['`covered` is reported as 59 rules: equivalent + partial + superset + overlap.', '`covered` is reported as 66 rules: equivalent + partial + superset + overlap.'],
            ['Forty-five axe-core rules currently have no implemented FocusTrace expectation matching their tested condition.', 'Thirty-eight axe-core rules currently have no implemented FocusTrace expectation matching their tested condition.'],
            [
              '### Accessible names and modern ARIA\n\n- dialog, meter, progressbar, tab, tooltip and treeitem naming;\n- ARIA conditional attributes;\n- ARIA required owned-child presence;\n- braille-equivalent naming;\n- host-element allowed-role restrictions.',
              '### Modern ARIA\n\nSpecialized naming for dialog, meter, progressbar, tab, tooltip, treeitem and native summary is now implemented as bounded `partial` coverage in #226. Remaining gaps in this family include:\n\n- ARIA conditional attributes;\n- ARIA required owned-child presence;\n- braille-equivalent naming;\n- host-element allowed-role restrictions.'
            ],
            [
              '## Priority after classification\n\nThe first functional implementation family remains **accessible names for specialized ARIA widgets and related native elements**.',
              '## Priority after specialized accessible names\n\nThe specialized accessible-name family is now implemented in #226. The next planned foundation is **ElementInternals semantics and form-associated labels** (#227), so modern custom elements can feed the same evidence contract where browser-observable data allows it.'
            ],
          ]);

          fs.unlinkSync('.github/workflows/tmp-specialized-names-docs.yml');
          NODE

      - name: Commit documentation patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md docs/RULES.md docs/AXE_CORE_PARITY_AUDIT.md .github/workflows/tmp-specialized-names-docs.yml
          git commit -m "Docs(a11y): document specialized accessible names"
          git push origin HEAD:feat/specialized-accessible-names-0.3.1
