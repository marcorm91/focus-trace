name: Temporary issue 243 complete wiring

on:
  push:
    branches:
      - feat/finding-lifecycle-profiles-0.7.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/finding-lifecycle-profiles-0.7.1
      - name: Wire complete issue 243 scope
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          # Shared contracts.
          replace(
              'shared/types.ts',
              "export type FindingOutcome = 'fail' | 'review' | 'warning';\nexport type ConformanceLevel = 'A' | 'AA' | 'AAA';",
              "export type FindingOutcome = 'fail' | 'review' | 'warning';\nexport type FindingReviewState = 'open' | 'reviewed' | 'accepted' | 'false-positive' | 'resolved' | 'regressed';\nexport type ConformanceLevel = 'A' | 'AA' | 'AAA';",
          )
          replace(
              'shared/types.ts',
              "  references: StandardReference[];\n  auditorNote?: AuditorNote;\n}",
              "  references: StandardReference[];\n  auditorNote?: AuditorNote;\n  reviewState?: FindingReviewState;\n  reviewStateUpdatedAt?: number;\n}",
          )
          replace(
              'shared/types.ts',
              "export type AuditorNotePersistenceWarning =\n  | 'focus-memory-write-failed'\n  | 'multipage-audit-write-failed';",
              "export type AuditorNotePersistenceWarning =\n  | 'focus-memory-write-failed'\n  | 'multipage-audit-write-failed'\n  | 'finding-review-write-failed';",
          )
          replace(
              'shared/types.ts',
              "export interface SaveAuditorNoteResponse {\n  state: SessionState;\n  warnings?: AuditorNotePersistenceWarning[];\n}\n\nexport type ExtensionMessage =",
              "export interface SaveAuditorNoteResponse {\n  state: SessionState;\n  warnings?: AuditorNotePersistenceWarning[];\n}\n\nexport interface SaveFindingReviewStateResponse {\n  state: SessionState;\n  warnings?: AuditorNotePersistenceWarning[];\n}\n\nexport type ExtensionMessage =",
          )
          replace(
              'shared/types.ts',
              "  | { type: 'FOCUSTRACE_SAVE_AUDITOR_NOTE'; tabId: number; target: AuditorNoteTarget; text: string }\n  | { type: 'FOCUSTRACE_RESET_TAB'; tabId: number }",
              "  | { type: 'FOCUSTRACE_SAVE_AUDITOR_NOTE'; tabId: number; target: AuditorNoteTarget; text: string }\n  | { type: 'FOCUSTRACE_SAVE_FINDING_REVIEW_STATE'; tabId: number; findingId: string; state?: FindingReviewState }\n  | { type: 'FOCUSTRACE_RESET_TAB'; tabId: number }",
          )

          # Finding review model exact optional-property compatibility.
          replace(
              'lib/audit/finding-review.ts',
              "      return issue.reviewState === 'open'\n        ? issue\n        : { ...issue, reviewState: 'open', reviewStateUpdatedAt: undefined };",
              "      return issue.reviewState === 'open'\n        ? issue\n        : { ...issue, reviewState: 'open' };",
          )

          # Background persistence and state changes.
          replace(
              'entrypoints/background.ts',
              "import { updateStoredMultipageAuditScan } from '../lib/audit/multipage-audit-storage';",
              "import {\n  applyStoredFindingReviews,\n  clearFindingReviewHistory,\n  resetStoredFindingReview,\n  saveFindingReviewState,\n  syncStoredFindingReviewNote,\n} from '../lib/audit/finding-review-storage';\nimport { updateStoredMultipageAuditScan } from '../lib/audit/multipage-audit-storage';",
          )
          replace(
              'entrypoints/background.ts',
              "  SaveScanResponse,\n  SaveAuditorNoteResponse,",
              "  SaveScanResponse,\n  SaveAuditorNoteResponse,\n  SaveFindingReviewStateResponse,",
          )
          replace(
              'entrypoints/background.ts',
              "  if (state.scan?.scannedAt === profiled.scannedAt) {\n    return deduplicateScanResult(profiled) as ProfiledScanResult;\n  }\n\n  const previous = comparableScanContext(state.scan, profiled) ? state.scan : undefined;\n  return applyFindingLifecycle(previous, profiled) as ProfiledScanResult;",
              "  const normalized = state.scan?.scannedAt === profiled.scannedAt\n    ? deduplicateScanResult(profiled) as ProfiledScanResult\n    : applyFindingLifecycle(\n        comparableScanContext(state.scan, profiled) ? state.scan : undefined,\n        profiled,\n      ) as ProfiledScanResult;\n  return await applyStoredFindingReviews(normalized) as ProfiledScanResult;",
          )
          replace(
              'entrypoints/background.ts',
              "          const results = await Promise.allSettled([\n            updateFocusMemoryScanNotes(next.scan),\n            updateStoredMultipageAuditScan(next.scan),\n          ]);\n          if (results[0]?.status === 'rejected') warnings.push('focus-memory-write-failed');\n          if (results[1]?.status === 'rejected') warnings.push('multipage-audit-write-failed');",
              "          const results = await Promise.allSettled([\n            syncStoredFindingReviewNote(next.scan, message.target.findingId),\n            updateFocusMemoryScanNotes(next.scan),\n            updateStoredMultipageAuditScan(next.scan),\n          ]);\n          if (results[0]?.status === 'rejected') warnings.push('finding-review-write-failed');\n          if (results[1]?.status === 'rejected') warnings.push('focus-memory-write-failed');\n          if (results[2]?.status === 'rejected') warnings.push('multipage-audit-write-failed');",
          )
          marker = "    if (message.type === 'FOCUSTRACE_RESET_TAB') {\n"
          review_branch = "    if (message.type === 'FOCUSTRACE_SAVE_FINDING_REVIEW_STATE') {\n      return serializeTabWrite(message.tabId, async () => {\n        const current = await getSession(message.tabId);\n        if (!current.scan) return { state: current } satisfies SaveFindingReviewStateResponse;\n        const nextScan = message.state\n          ? await saveFindingReviewState(current.scan, message.findingId, message.state)\n          : await resetStoredFindingReview(current.scan, message.findingId);\n        const next = nextScan === current.scan ? current : { ...current, scan: nextScan };\n        if (next !== current) await saveSession(next);\n        const warnings: AuditorNotePersistenceWarning[] = [];\n        if (next.scan) {\n          const persisted = await Promise.allSettled([updateStoredMultipageAuditScan(next.scan)]);\n          if (persisted[0]?.status === 'rejected') warnings.push('multipage-audit-write-failed');\n        }\n        await broadcast(next);\n        return {\n          state: next,\n          ...(warnings.length ? { warnings } : {}),\n        } satisfies SaveFindingReviewStateResponse;\n      });\n    }\n\n"
          replace('entrypoints/background.ts', marker, review_branch + marker)
          replace(
              'entrypoints/background.ts',
              "        const next = resetSessionState(current, message.tabId);\n        await saveSession(next);",
              "        const next = resetSessionState(current, message.tabId);\n        await clearFindingReviewHistory();\n        await saveSession(next);",
          )

          # Site Audit rehydrates local auditor workflow before profile/lifecycle persistence.
          replace(
              'lib/audit/multipage-audit-storage.ts',
              "import { loadActiveAuditProfile } from './audit-profile-storage';",
              "import { loadActiveAuditProfile } from './audit-profile-storage';\nimport { applyStoredFindingReviews } from './finding-review-storage';",
          )
          replace(
              'lib/audit/multipage-audit-storage.ts',
              "  const current = await loadMultipageAuditStore();\n  const activeProfile = await loadActiveAuditProfile();\n  const preparedScan = profileSupportsScope(activeProfile, 'site')\n    ? applyAuditProfile(scan, activeProfile, 'site')\n    : scan;",
              "  const current = await loadMultipageAuditStore();\n  const activeProfile = await loadActiveAuditProfile();\n  const reviewedScan = await applyStoredFindingReviews(scan);\n  const preparedScan = profileSupportsScope(activeProfile, 'site')\n    ? applyAuditProfile(reviewedScan, activeProfile, 'site')\n    : reviewedScan;",
          )

          # App message wiring.
          replace(
              'entrypoints/sidepanel/App.tsx',
              "  FocusMemoryCapturedEvidence,\n  SaveAuditorNoteResponse,\n  SaveScanResponse,",
              "  FindingReviewState,\n  FocusMemoryCapturedEvidence,\n  SaveAuditorNoteResponse,\n  SaveFindingReviewStateResponse,\n  SaveScanResponse,",
          )
          anchor = "  const runScan = useCallback(async () => {\n"
          callback = "  const saveFindingReview = useCallback(async (findingId: string, state?: FindingReviewState) => {\n    if (tabId == null) return;\n    setError(undefined);\n    try {\n      const response = (await browser.runtime.sendMessage({\n        type: 'FOCUSTRACE_SAVE_FINDING_REVIEW_STATE',\n        tabId,\n        findingId,\n        ...(state ? { state } : {}),\n      } satisfies ExtensionMessage)) as SaveFindingReviewStateResponse;\n      setSession(response.state);\n      if (response.warnings?.length) {\n        setError(tr(\n          language,\n          'The workflow state is saved in this session, but Site Audit history could not be updated.',\n          'El estado de gestión está guardado en esta sesión, pero no se pudo actualizar el historial de Site Audit.',\n        ));\n      }\n    } catch (reason) {\n      setError(localizedUserError(reason, language, 'session'));\n      throw reason;\n    }\n  }, [language, setSession, tabId]);\n\n"
          replace('entrypoints/sidepanel/App.tsx', anchor, callback + anchor)
          replace(
              'entrypoints/sidepanel/App.tsx',
              "            onSaveAuditorNote={(findingId, text) => saveAuditorNote({ kind: 'scan-finding', findingId }, text)}\n          />",
              "            onSaveAuditorNote={(findingId, text) => saveAuditorNote({ kind: 'scan-finding', findingId }, text)}\n            onSaveFindingReviewState={saveFindingReview}\n          />",
          )

          # Scan UI wiring.
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "import { FindingGuidance } from '../components/FindingGuidance';\nimport { ImpactMatrix } from '../components/ImpactMatrix';",
              "import { FindingGuidance } from '../components/FindingGuidance';\nimport { FindingReviewStateControl } from '../components/FindingReviewStateControl';\nimport { ImpactMatrix } from '../components/ImpactMatrix';",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "import type { FindingOutcome, ScanIssue, ScanResult, Severity } from '../../../shared/types';",
              "import type { FindingOutcome, FindingReviewState, ScanIssue, ScanResult, Severity } from '../../../shared/types';",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onSelectComponent,\n  onSaveAuditorNote,\n}: {",
              "  onSelectComponent,\n  onSaveAuditorNote,\n  onSaveFindingReviewState,\n}: {",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onSelectComponent: () => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n}) {",
              "  onSelectComponent: () => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n  onSaveFindingReviewState: (findingId: string, state?: FindingReviewState) => void | Promise<void>;\n}) {",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "                        onSaveAuditorNote={onSaveAuditorNote}\n                        key={issues[0]!.ruleId}",
              "                        onSaveAuditorNote={onSaveAuditorNote}\n                        onSaveFindingReviewState={onSaveFindingReviewState}\n                        key={issues[0]!.ruleId}",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onLocate,\n  onSaveAuditorNote,\n}: {\n  issues: ScanIssue[];",
              "  onLocate,\n  onSaveAuditorNote,\n  onSaveFindingReviewState,\n}: {\n  issues: ScanIssue[];",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onLocate: (selector: string) => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n}) {",
              "  onLocate: (selector: string) => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n  onSaveFindingReviewState: (findingId: string, state?: FindingReviewState) => void | Promise<void>;\n}) {",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "          onLocate={onLocate}\n          onSaveAuditorNote={onSaveAuditorNote}\n        />",
              "          onLocate={onLocate}\n          onSaveAuditorNote={onSaveAuditorNote}\n          onSaveFindingReviewState={onSaveFindingReviewState}\n        />",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onLocate,\n  onSaveAuditorNote,\n}: {\n  issue: ScanIssue;",
              "  onLocate,\n  onSaveAuditorNote,\n  onSaveFindingReviewState,\n}: {\n  issue: ScanIssue;",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "  onLocate: (selector: string) => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n}) {\n  const copy = localizedScanIssue(issue, language);",
              "  onLocate: (selector: string) => void | Promise<void>;\n  onSaveAuditorNote: (findingId: string, text: string) => void | Promise<void>;\n  onSaveFindingReviewState: (findingId: string, state?: FindingReviewState) => void | Promise<void>;\n}) {\n  const copy = localizedScanIssue(issue, language);",
          )
          replace(
              'entrypoints/sidepanel/views/ScanView.tsx',
              "      <FindingGuidance issue={issue} language={language} />\n      <AuditorNoteEditor",
              "      <FindingGuidance issue={issue} language={language} />\n      <FindingReviewStateControl\n        state={issue.reviewState}\n        language={language}\n        onChange={(state) => onSaveFindingReviewState(issue.id, state)}\n        onReset={() => onSaveFindingReviewState(issue.id)}\n      />\n      <AuditorNoteEditor",
          )

          # Audit profile UI: standards and exact rule IDs.
          replace(
              'entrypoints/sidepanel/components/AuditProfileSettings.tsx',
              "  ALL_AUDIT_PROFILE_SCOPES,\n  ALL_AUDIT_PROFILE_SEVERITIES,",
              "  ALL_AUDIT_PROFILE_REFERENCE_TYPES,\n  ALL_AUDIT_PROFILE_SCOPES,\n  ALL_AUDIT_PROFILE_SEVERITIES,",
          )
          replace(
              'entrypoints/sidepanel/components/AuditProfileSettings.tsx',
              "  type AuditProfileScope,\n  type AuditProfileStandard,",
              "  type AuditProfileReferenceType,\n  type AuditProfileScope,\n  type AuditProfileStandard,",
          )
          replace(
              'entrypoints/sidepanel/components/AuditProfileSettings.tsx',
              "    scopes: [...profile.scopes],\n    severities: [...profile.severities],\n    ruleFamilies: [...profile.ruleFamilies],",
              "    scopes: [...profile.scopes],\n    referenceTypes: [...profile.referenceTypes],\n    ruleIds: [...profile.ruleIds],\n    severities: [...profile.severities],\n    ruleFamilies: [...profile.ruleFamilies],",
          )
          replace(
              'entrypoints/sidepanel/components/AuditProfileSettings.tsx',
              "    if (!draft.name.trim() || !draft.scopes.length || !draft.severities.length || !draft.ruleFamilies.length) {",
              "    if (!draft.name.trim() || !draft.scopes.length || !draft.referenceTypes.length || !draft.severities.length || !draft.ruleFamilies.length) {",
          )
          replace(
              'entrypoints/sidepanel/components/AuditProfileSettings.tsx',
              "        'Keep a name and at least one scope, severity and rule family.',\n        'Mantén un nombre y al menos un alcance, severidad y familia de reglas.',",
              "        'Keep a name and at least one scope, standards source, severity and rule family.',\n        'Mantén un nombre y al menos un alcance, fuente normativa, severidad y familia de reglas.',",
          )
          families_anchor = "      <div className=\"audit-profile-dimension\" role=\"group\" aria-label={tr(language, 'Profile rule families', 'Familias de reglas del perfil')}>\n"
          standards_ui = "      <div className=\"audit-profile-dimension\" role=\"group\" aria-label={tr(language, 'Profile standards sources', 'Fuentes normativas del perfil')}>\n        <strong>{tr(language, 'Standards sources', 'Fuentes normativas')}</strong>\n        {ALL_AUDIT_PROFILE_REFERENCE_TYPES.map((referenceType) => (\n          <label key={referenceType}>\n            <input\n              type=\"checkbox\"\n              disabled={!editable}\n              checked={draft.referenceTypes.includes(referenceType)}\n              onChange={(event) => setDraft({ ...draft, referenceTypes: toggleValue<AuditProfileReferenceType>(draft.referenceTypes, referenceType, event.currentTarget.checked) })}\n            />\n            <span>{referenceType}</span>\n          </label>\n        ))}\n      </div>\n\n"
          replace('entrypoints/sidepanel/components/AuditProfileSettings.tsx', families_anchor, standards_ui + families_anchor)
          save_anchor = "      <button className=\"audit-profile-save\" type=\"button\" disabled={!editable} onClick={() => void saveDraft()}>\n"
          rule_ui = "      <label className=\"audit-profile-field\">\n        <span>{tr(language, 'Exact rule IDs', 'IDs exactos de regla')}</span>\n        <textarea\n          rows={4}\n          disabled={!editable}\n          value={draft.ruleIds.join('\\n')}\n          placeholder=\"FT-WCAG-003\\nFT-REVIEW-024\"\n          aria-describedby=\"audit-profile-rule-ids-help\"\n          onChange={(event) => setDraft({\n            ...draft,\n            ruleIds: event.currentTarget.value.split(/[\\s,]+/).map((value) => value.trim()).filter(Boolean),\n          })}\n        />\n        <small id=\"audit-profile-rule-ids-help\">\n          {tr(\n            language,\n            'Leave empty to include every rule allowed by the other filters. Use FocusTrace rule IDs separated by spaces, commas or new lines.',\n            'Déjalo vacío para incluir todas las reglas permitidas por los demás filtros. Usa IDs de FocusTrace separados por espacios, comas o líneas.',\n          )}\n        </small>\n      </label>\n\n"
          replace('entrypoints/sidepanel/components/AuditProfileSettings.tsx', save_anchor, rule_ui + save_anchor)
          replace(
              'entrypoints/sidepanel/components/audit-profile-settings.css',
              ".audit-profile-field input,\n.audit-profile-field select {",
              ".audit-profile-field input,\n.audit-profile-field select,\n.audit-profile-field textarea {",
          )
          replace(
              'entrypoints/sidepanel/components/audit-profile-settings.css',
              "  min-height: 36px;\n}\n\n.audit-profile-actions",
              "  min-height: 36px;\n}\n\n.audit-profile-field textarea {\n  resize: vertical;\n  min-height: 88px;\n}\n\n.audit-profile-actions",
          )

          # Profile model tests for exact rule and source reproducibility.
          replace(
              'tests/audit-profiles.test.ts',
              "    expect(profile.severities).toEqual(ALL_AUDIT_PROFILE_SEVERITIES);\n    expect(profile.ruleFamilies).toEqual(ALL_AUDIT_RULE_FAMILIES);",
              "    expect(profile.severities).toEqual(ALL_AUDIT_PROFILE_SEVERITIES);\n    expect(profile.referenceTypes).toEqual(['WCAG', 'ACT', 'WAI-ARIA', 'WAI-ARIA APG', 'HTML']);\n    expect(profile.ruleIds).toEqual([]);\n    expect(profile.ruleFamilies).toEqual(ALL_AUDIT_RULE_FAMILIES);",
          )
          test_anchor = "  it('classifies representative rule families without third-party metadata', () => {\n"
          profile_test = "  it('reproduces exact rule and standards-source filters', () => {\n    const profile = custom({\n      standard: 'all',\n      referenceTypes: ['WCAG'],\n      ruleIds: ['FT-COLOR-001'],\n      severities: ['serious'],\n      ruleFamilies: ['visual'],\n      scopes: ['page'],\n    });\n    const filtered = applyAuditProfile(scan([\n      issue('keep'),\n      issue('other-rule', { ruleId: 'FT-COLOR-002' }),\n      issue('other-source', { references: [{ type: 'ACT', id: 'abc', label: 'ACT', url: 'https://www.w3.org/' }] }),\n    ]), profile, 'page');\n    expect(filtered.issues.map((item) => item.id)).toEqual(['keep']);\n    expect(filtered.auditProfile?.ruleIds).toEqual(['FT-COLOR-001']);\n    expect(filtered.auditProfile?.referenceTypes).toEqual(['WCAG']);\n  });\n\n"
          replace('tests/audit-profiles.test.ts', test_anchor, profile_test + test_anchor)

          # Public docs.
          replace(
              'README.md',
              "| **Audit profiles** | Page, component or Site Audit reporting | Applies a reusable local WCAG target, severity and rule-family filter before findings are persisted for that scope. Custom profiles can be duplicated, edited, applied, deleted or reset locally. | Applied profile snapshot plus filtered, deduplicated findings; the inspected page and rule engine are not modified. |",
              "| **Audit profiles** | Page, component or Site Audit reporting | Applies reusable local filters for WCAG target, standards source, exact FocusTrace rule IDs, severity, rule family and scope. Custom profiles can be duplicated, edited, applied, deleted or reset locally. | Applied profile snapshot plus a reproducible enabled-rule set; the inspected page and rule engine are not modified. |",
          )
          replace(
              'README.es.md',
              "| **Perfiles de auditoría** | Informes de página, componente o Site Audit | Aplica un filtro local reutilizable por objetivo WCAG, severidad y familia de reglas antes de persistir los hallazgos de ese alcance. Los perfiles personalizados se pueden duplicar, editar, aplicar, borrar o restablecer localmente. | Snapshot del perfil aplicado y hallazgos filtrados/deduplicados; no modifica la página inspeccionada ni el motor de reglas. |",
              "| **Perfiles de auditoría** | Informes de página, componente o Site Audit | Aplica filtros locales reutilizables por objetivo WCAG, fuente normativa, IDs exactos de regla FocusTrace, severidad, familia y alcance. Los perfiles personalizados se pueden duplicar, editar, aplicar, borrar o restablecer localmente. | Snapshot del perfil aplicado y conjunto reproducible de reglas habilitadas; no modifica la página inspeccionada ni el motor de reglas. |",
          )
          lifecycle_para = "Repeated static findings are deduplicated only when **rule, target and evidence are all the same**. Evidence changes on the same rule/target remain visible and become `changed`; an absent prior identity becomes `resolved` only in the comparison history, and a later reappearance becomes `new` again. Lifecycle comparison is limited to compatible document/scope/profile contexts. Recheck keeps its additional `missing`/`inconclusive` safety states, while Replay and Site Audit use the same `new`/`persistent`/`changed`/`resolved` vocabulary where a complete comparison is available."
          workflow_para = lifecycle_para + "\n\nEach static finding also has a separate local auditor workflow state: `open`, `reviewed`, `accepted`, `false-positive`, `resolved` or `regressed`. The state is bounded local metadata and can be reset independently of the detected FAIL/REVIEW/WARNING outcome. Auditor notes are preserved with the same managed finding identity. If a finding marked `resolved` appears again in a later compatible scan, FocusTrace marks that managed state `regressed`; saving or Rechecking the same observation does not manufacture a regression."
          replace('README.md', lifecycle_para, workflow_para)
          lifecycle_es = "Los hallazgos estáticos repetidos solo se deduplican cuando **regla, destino y evidencia coinciden**. Si cambia la evidencia para la misma regla/destino, el hallazgo sigue visible y pasa a `changed`; una identidad previa ausente queda como `resolved` únicamente en el historial comparativo y, si reaparece más adelante, vuelve a ser `new`. La comparación del ciclo de vida se limita a contextos compatibles de documento/alcance/perfil. Recheck mantiene además sus estados de seguridad `missing`/`inconclusive`, mientras Replay y Site Audit comparten `new`/`persistent`/`changed`/`resolved` cuando existe una comparación completa."
          workflow_es = lifecycle_es + "\n\nCada hallazgo estático dispone además de un estado local de gestión del auditor independiente: `open`, `reviewed`, `accepted`, `false-positive`, `resolved` o `regressed`. Es metadato local y acotado, se puede restablecer sin cambiar el resultado FAIL/REVIEW/WARNING detectado y conserva las notas del auditor con la misma identidad gestionada. Si un hallazgo marcado `resolved` reaparece en un análisis compatible posterior, FocusTrace lo marca como `regressed`; guardar o recomprobar la misma observación no genera una regresión artificial."
          replace('README.es.md', lifecycle_es, workflow_es)
          replace(
              'README.md',
              "custom profiles can select page/component/Site Audit scope, all supported rules or a WCAG A/AA/AAA target, severities and FocusTrace rule families.",
              "custom profiles can select page/component/Site Audit scope, all supported rules or a WCAG A/AA/AAA target, standards sources, exact FocusTrace rule IDs, severities and rule families.",
          )
          replace(
              'README.es.md',
              "los perfiles personalizados pueden seleccionar alcance de página/componente/Site Audit, todas las reglas compatibles o un objetivo WCAG A/AA/AAA, severidades y familias de reglas de FocusTrace.",
              "los perfiles personalizados pueden seleccionar alcance de página/componente/Site Audit, todas las reglas compatibles o un objetivo WCAG A/AA/AAA, fuentes normativas, IDs exactos de regla FocusTrace, severidades y familias de reglas.",
          )
          rules_anchor = "Lifecycle is derived from adjacent observations, so it is reversible: a resolved finding that appears again in the next compatible scan is `new` again. Static Session/Memory comparison uses the same persisted normalized scan. Site Audit recomputes lifecycle against the previous stored scan of the same normalized page before replacement. Recheck does not rewrite the original finding and retains its conservative `missing` and `inconclusive` states. Saved Replay already uses the shared four-state vocabulary for completed runtime comparisons, with `missing-element` and `broken-flow` reserved for journeys that cannot be completed safely. Absence is never promoted to `resolved` when the required comparison is incomplete."
          rules_new = rules_anchor + "\n\nThe automatic lifecycle is separate from the auditor-managed workflow state. A static finding can be `open`, `reviewed`, `accepted`, `false-positive`, `resolved` or `regressed` without changing its rule outcome or severity. Managed states and auditor notes are stored locally against a hashed scope/finding identity, bounded to 500 records and removable/resettable by the user. A `resolved` managed finding becomes `regressed` only when the same identity is observed in a later scan timestamp; updating the same observation, including Recheck persistence, does not trigger regression."
          replace('docs/RULES.md', rules_anchor, rules_new)
          replace(
              'docs/RULES.md',
              "Users can keep up to 20 custom profiles and select page, component and/or Site Audit scope, all supported rules or a WCAG A/AA/AAA target, severity set and rule-family set.",
