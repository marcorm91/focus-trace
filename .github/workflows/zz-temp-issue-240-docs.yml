name: Temp issue 240 docs

on:
  push:
    branches:
      - feat/guided-table-form-zoom-media-0.6.2

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/guided-table-form-zoom-media-0.6.2
      - name: Apply documentation patch
        run: node tools/patch-issue-240-docs.mjs
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Docs(guided): document table form resize media tests"
          git push origin HEAD:feat/guided-table-form-zoom-media-0.6.2
