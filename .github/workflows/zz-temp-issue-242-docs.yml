name: temp-issue-242-docs
on:
  push:
    branches: [feat/saved-user-flow-regression-0.7.0]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/saved-user-flow-regression-0.7.0
      - name: Apply saved replay docs
        run: |
          python tools/zz-issue-242-docs.py
          git rm tools/zz-issue-242-docs.py .github/workflows/zz-temp-issue-242-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.es.md docs/RULES.md
          git commit -m "Docs(replay): document saved user-flow regressions"
          git push origin HEAD:feat/saved-user-flow-regression-0.7.0
