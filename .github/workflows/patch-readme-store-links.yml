name: Patch README store links

on:
  push:
    branches:
      - release/v0.2.1

permissions:
  contents: write

jobs:
  patch-readmes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.2.1
      - name: Add official Chrome Web Store links
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const storeUrl = 'https://chromewebstore.google.com/detail/focustrace/efmfklamjafbknbmadpfmlbhobnoffnn';

          const patches = [
            {
              path: 'README.md',
              anchor: 'FocusTrace is free software licensed under **GNU GPL v3.0 only**. The source-code license and the FocusTrace project identity are intentionally separate; see [License and project identity](#license-and-project-identity).',
              block: `\n\n## Install\n\nFocusTrace is available from the official Chrome Web Store:\n\n- [Install FocusTrace from the Chrome Web Store](${storeUrl})\n\nThe store listing may temporarily show an earlier version while a newer release is under review.`,
            },
            {
              path: 'README.es.md',
              anchor: 'FocusTrace es software libre con licencia **GNU GPL v3.0 únicamente**. La licencia del código fuente y la identidad del proyecto FocusTrace se tratan por separado; consulta [Licencia e identidad del proyecto](#licencia-e-identidad-del-proyecto).',
              block: `\n\n## Instalar\n\nFocusTrace está disponible en la página oficial de Chrome Web Store:\n\n- [Instalar FocusTrace desde Chrome Web Store](${storeUrl})\n\nLa ficha de la tienda puede mostrar temporalmente una versión anterior mientras una nueva release está en revisión.`,
            },
          ];

          for (const patch of patches) {
            let source = fs.readFileSync(patch.path, 'utf8');
            if (source.includes(storeUrl)) continue;
            if (!source.includes(patch.anchor)) throw new Error(`Anchor not found in ${patch.path}`);
            source = source.replace(patch.anchor, patch.anchor + patch.block);
            fs.writeFileSync(patch.path, source);
          }
          NODE
          git diff --check
          git diff -- README.md README.es.md
      - name: Commit README store links
        run: |
          if git diff --quiet -- README.md README.es.md; then
            echo "README store links already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md
          git commit -m "docs: link official Chrome Web Store listing"
          git push origin HEAD:release/v0.2.1
