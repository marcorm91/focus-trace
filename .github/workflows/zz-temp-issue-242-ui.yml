name: temp-issue-242-ui
on:
  push:
    branches: [feat/saved-user-flow-regression-0.7.0]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/saved-user-flow-regression-0.7.0
      - name: Patch Replay wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          replay = Path('entrypoints/sidepanel/views/ReplayView.tsx')
          text = replay.read_text()
          old = "import type { RuntimeEvent, RuntimeInteraction } from '../../../shared/types';"
          new = "import type { RuntimeBreakpointSettings, RuntimeEvent, RuntimeInteraction } from '../../../shared/types';"
          if old not in text:
              raise SystemExit('Replay type import anchor missing')
          text = text.replace(old, new, 1)

          old = "import { Empty, ReferenceList } from '../components/Common';"
          new = "import { Empty, ReferenceList } from '../components/Common';\nimport { SavedFlowRegressionPanel } from './SavedFlowRegressionPanel';"
          if old not in text:
              raise SystemExit('Replay component import anchor missing')
          text = text.replace(old, new, 1)

          old = "  recording,\n  level,\n  language,"
          new = "  recording,\n  breakpoints,\n  level,\n  language,"
          if old not in text:
              raise SystemExit('Replay destructure anchor missing')
          text = text.replace(old, new, 1)

          old = "  recording: boolean;\n  level: ExplanationLevel;"
          new = "  recording: boolean;\n  breakpoints: RuntimeBreakpointSettings;\n  level: ExplanationLevel;"
          if old not in text:
              raise SystemExit('Replay props anchor missing')
          text = text.replace(old, new, 1)

          marker = "    </section>\n  );\n}"
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('Replay closing anchor missing')
          panel = "      <SavedFlowRegressionPanel\n        events={events}\n        interactions={interactions}\n        recording={recording}\n        breakpoints={breakpoints}\n        language={language}\n      />\n\n"
          text = text[:pos] + panel + text[pos:]
          replay.write_text(text)

          trace = Path('entrypoints/sidepanel/views/TraceView.tsx')
          text = trace.read_text()
          old = "              recording={recording}\n              level={level}"
          new = "              recording={recording}\n              breakpoints={breakpointSettings}\n              level={level}"
          if old not in text:
              raise SystemExit('Trace Replay anchor missing')
          trace.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/zz-temp-issue-242-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add entrypoints/sidepanel/views/ReplayView.tsx entrypoints/sidepanel/views/TraceView.tsx
          git commit -m "Feat(replay): wire saved user-flow regressions"
          git push origin HEAD:feat/saved-user-flow-regression-0.7.0
