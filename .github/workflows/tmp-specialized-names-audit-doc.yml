name: Temporary specialized-name audit cleanup

on:
  push:
    branches:
      - feat/specialized-accessible-names-0.3.1

permissions:
  contents: write

jobs:
  patch-audit-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/specialized-accessible-names-0.3.1
          fetch-depth: 1
      - name: Apply bounded audit-document edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/AXE_CORE_PARITY_AUDIT.md';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '## What the classification changes publicly\n\nNothing in #225 changes FocusTrace rule behavior or user-facing capability identifiers. The English and Spanish public catalogs therefore remain unchanged for this issue. A later functional rule PR must update the appropriate public catalogs and rule documentation when it changes actual product capability.',
              '## What #226 changes publicly\n\n#226 adds three public FocusTrace contracts: `FT-WCAG-014`, `FT-WCAG-015` and `FT-WARN-022`. The English and Spanish capability catalogs and the rule methodology documentation are updated together. The benchmark relationships for the seven targeted axe-core rules move from `missing` to conservative `partial` coverage; no rule is promoted to `equivalent`.'
            ],
            [
              '- button, link and form-control naming;\n- several ARIA vocabulary, role, state/property and ownership checks;',
              '- button, link, form-control and specialized widget naming;\n- several ARIA vocabulary, role, state/property and ownership checks;'
            ],
            [
              'This is a strong next step because it has high user impact, can reuse the current semantic/name infrastructure, is largely deterministic, has a bounded fixture surface and closes several explicit benchmark gaps without coupling FocusTrace to axe-core implementation details.\n\nCandidate gaps include:\n\n- `aria-dialog-name`;\n- `aria-meter-name`;\n- `aria-progressbar-name`;\n- `aria-tab-name`;\n- `aria-tooltip-name`;\n- `aria-treeitem-name`;\n- `summary-name`;\n- frame accessible names in a separate focused change if frame collection requires different runtime handling.',
              'ElementInternals is the logical next step because it extends the same semantic and accessible-name evidence model to modern form-associated custom elements without broadening browser permissions. It must remain conservative when internals are unavailable or browser behavior differs.\n\nFrame accessible names remain a separate gap family because frame collection and cross-document inspection have different applicability and runtime constraints.'
            ],
          ];
          for (const [needle, replacement] of replacements) {
            if (!text.includes(needle)) throw new Error(`Expected audit text not found: ${needle.slice(0, 120)}`);
            text = text.replace(needle, replacement);
          }
          fs.writeFileSync(path, text);
          fs.unlinkSync('.github/workflows/tmp-specialized-names-audit-doc.yml');
          NODE
      - name: Commit audit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AXE_CORE_PARITY_AUDIT.md .github/workflows/tmp-specialized-names-audit-doc.yml
          git commit -m "Docs(audit): finalize specialized-name baseline"
          git push origin HEAD:feat/specialized-accessible-names-0.3.1
