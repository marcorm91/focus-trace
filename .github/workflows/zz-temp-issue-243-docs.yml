name: Temporary issue 243 docs

on:
  push:
    branches:
      - feat/finding-lifecycle-profiles-0.7.1
    paths:
      - tools/zz-issue-243-docs.py
      - .github/workflows/zz-temp-issue-243-docs.yml

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/finding-lifecycle-profiles-0.7.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply documentation patch
        run: python tools/zz-issue-243-docs.py
      - name: Remove temporary helpers
        run: rm tools/zz-issue-243-docs.py .github/workflows/zz-temp-issue-243-docs.yml
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md docs/RULES.md tools/zz-issue-243-docs.py .github/workflows/zz-temp-issue-243-docs.yml
          git commit -m "Docs(a11y): document lifecycle and audit profiles"
          git push origin HEAD:feat/finding-lifecycle-profiles-0.7.1
