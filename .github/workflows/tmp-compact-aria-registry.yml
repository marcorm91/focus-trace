name: Temporary compact ARIA registry

on:
  push:
    branches:
      - feat/aria-role-state-relationships-0.3.3
    paths:
      - .github/workflows/tmp-compact-aria-registry.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aria-role-state-relationships-0.3.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compact optional ARIA relationship fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/aria-sync.mjs')
          text = path.read_text()
          old = '''      const section = roleSection(specHtml, role.name);\n      const deprecatedVersion = deprecatedRoleVersion(specHtml, role.name);\n      return {\n        name: role.name,\n        parentRoles: sortedUnique(role.parentRoles ?? []),\n        requiredParentRoles: roleReferences(section, 'role-scope'),\n        allowedChildRoles: roleReferences(section, 'role-mustcontain'),\n        deprecated: Boolean(deprecatedVersion),'''
          new = '''      const section = roleSection(specHtml, role.name);\n      const deprecatedVersion = deprecatedRoleVersion(specHtml, role.name);\n      const requiredParentRoles = roleReferences(section, 'role-scope');\n      const allowedChildRoles = roleReferences(section, 'role-mustcontain');\n      return {\n        name: role.name,\n        parentRoles: sortedUnique(role.parentRoles ?? []),\n        ...(requiredParentRoles.length ? { requiredParentRoles } : {}),\n        ...(allowedChildRoles.length ? { allowedChildRoles } : {}),\n        deprecated: Boolean(deprecatedVersion),'''
          if old not in text:
              raise SystemExit('aria-sync role block marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'roles.reduce((total, role) => total + role.requiredParentRoles.length, 0)',
              'roles.reduce((total, role) => total + (role.requiredParentRoles?.length ?? 0), 0)',
          )
          text = text.replace(
              'roles.reduce((total, role) => total + role.allowedChildRoles.length, 0)',
              'roles.reduce((total, role) => total + (role.allowedChildRoles?.length ?? 0), 0)',
          )
          path.write_text(text)

          path = Path('lib/audit/standards-registry.ts')
          text = path.read_text()
          text = text.replace('  requiredParentRoles: string[];\n  allowedChildRoles: string[];', '  requiredParentRoles?: string[];\n  allowedChildRoles?: string[];')
          path.write_text(text)

          path = Path('lib/audit/aria-validator.ts')
          text = path.read_text()
          replacements = {
              'role.requiredParentRoles.includes(parentRole)': '(role.requiredParentRoles ?? []).includes(parentRole)',
              'explicitRole.requiredParentRoles.length': '(explicitRole.requiredParentRoles ?? []).length',
              'explicitRole.requiredParentRoles.join(\', \')': '(explicitRole.requiredParentRoles ?? []).join(\', \')',
              'const allowed = explicitRole.allowedChildRoles;': 'const allowed = explicitRole.allowedChildRoles ?? [];',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'aria-validator marker missing: {old}')
              text = text.replace(old, new)
          path.write_text(text)

          path = Path('docs/AXE_CORE_PARITY_AUDIT.md')
          text = path.read_text()
          text = text.replace(
              'It does **not** mean FocusTrace behaves identically to axe-core for 59 rules; only the five `equivalent` entries make that stronger claim.',
              'It does **not** mean FocusTrace behaves identically to axe-core for 71 rules; only the six `equivalent` entries make that stronger claim.',
          )
          path.write_text(text)
          PY
      - name: Regenerate ARIA registry only
        run: node tools/aria-sync.mjs generated/aria-registry.json
      - name: Validate synchronized registry
        run: npm run standards:validate
      - name: Commit compact registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/aria-sync.mjs generated/aria-registry.json lib/audit/standards-registry.ts lib/audit/aria-validator.ts docs/AXE_CORE_PARITY_AUDIT.md
          git commit -m "Perf(a11y): compact ARIA relationship registry"
          git push
