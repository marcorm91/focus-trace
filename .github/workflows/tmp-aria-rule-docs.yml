name: Temporary ARIA rule docs update

on:
  push:
    branches:
      - feat/aria-role-state-relationships-0.3.3
    paths:
      - .github/workflows/tmp-aria-rule-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aria-role-state-relationships-0.3.3
      - name: Update methodology, severity and parity docs
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path('docs/RULES.md')
          text = rules.read_text()
          heading = '## ARIA role, state and relationship validation\n'
          if heading not in text:
              text += '''\n\n## ARIA role, state and relationship validation\n\n`FT-WCAG-016` is a page-only deterministic check for `body[aria-hidden="true"]`. ARIA in HTML explicitly prohibits hiding the document body from the accessibility tree; component scans do not execute this document-level expectation. The rule records FAIL only for the explicit top-level `true` value and otherwise records bounded PASS evidence.\n\n`FT-WARN-023` collects bounded host-language and conditional ARIA authoring contradictions. Current coverage includes high-impact ARIA in HTML role restrictions, native checkbox/radio `aria-checked` conflicts, and treegrid-only row states/properties. Accessibility parent context resolves valid `aria-owns` ownership as well as DOM ancestry. These findings remain WARNING because invalid ARIA authoring is not automatically a complete WCAG failure.\n\n`FT-REVIEW-029` checks observable equivalence for `aria-braillelabel`, `aria-brailleroledescription` and `aria-roledescription`. Empty values, missing non-braille counterparts or custom role descriptions without a resolved semantic role remain REVIEW where WAI-ARIA uses SHOULD-level guidance or user-agent repair/exposure can affect the final result.\n\nRequired accessibility-parent and allowed accessibility-child relationships are not maintained in parallel tables. `tools/aria-sync.mjs` extracts them from the public WAI-ARIA 1.3 role tables into `generated/aria-registry.json`; `aria-owns`, IDREF and `aria-activedescendant` checks continue to share the same local ownership model. APG guidance is not used as normative evidence for these static authoring outcomes.\n'''
          rules.write_text(text)

          severity = Path('docs/SEVERITY-AUDIT.md')
          text = severity.read_text()
          heading = '## ARIA role-state package (#228)\n'
          if heading not in text:
              text += '''\n\n## ARIA role-state package (#228)\n\n- `FT-WCAG-016` — **critical**. Explicitly hiding the top-level document body can remove essentially the whole page from the accessibility tree, so the bounded condition is a deterministic FAIL.\n- `FT-WARN-023` — **serious** WARNING. Host-language or conditional ARIA contradictions can cause semantics to be ignored or repaired inconsistently, but the authoring defect alone is not promoted to a complete WCAG failure.\n- `FT-REVIEW-029` — **serious** REVIEW. Braille/custom role-description equivalence can materially affect assistive-technology output, while SHOULD-level guidance and platform repair keep the final judgement contextual.\n\nThese severities describe impact when the modeled condition is applicable. APG remains informative and is not presented as normative WCAG evidence.\n'''
          severity.write_text(text)

          audit = Path('docs/AXE_CORE_PARITY_AUDIT.md')
          text = audit.read_text()
          text = text.replace('| Equivalent | 5 |\n| Partial | 30 |\n| Superset | 10 |\n| Overlap | 21 |\n| Missing | 38 |', '| Equivalent | 6 |\n| Partial | 33 |\n| Superset | 10 |\n| Overlap | 22 |\n| Missing | 33 |')
          text = text.replace('`covered` is reported as 66 rules: equivalent + partial + superset + overlap.', '`covered` is reported as 71 rules: equivalent + partial + superset + overlap.')
          text = text.replace('Thirty-eight axe-core rules currently have no implemented FocusTrace expectation matching their tested condition.', 'Thirty-three axe-core rules currently have no implemented FocusTrace expectation matching their tested condition.')
          old = '''Specialized naming for dialog, meter, progressbar, tab, tooltip, treeitem and native summary is now implemented as bounded `partial` coverage in #226. Remaining gaps in this family include:\n\n- ARIA conditional attributes;\n- ARIA required owned-child presence;\n- braille-equivalent naming;\n- host-element allowed-role restrictions.\n'''
          new = '''Specialized naming for dialog, meter, progressbar, tab, tooltip, treeitem and native summary is implemented as bounded coverage in #226. #228 adds synchronized required-parent/allowed-child role relationships, bounded host/conditional authoring checks, braille/custom role-description review and the deterministic hidden-body condition. The corresponding benchmark entries move conservatively from `missing` to `partial`, `overlap` or `equivalent` according to the implemented applicability; FocusTrace does not claim complete ARIA in HTML host-role coverage.\n'''
          text = text.replace(old, new)
          priority = '## Priority after specialized accessible names\n'
          if priority in text:
              start = text.index(priority)
              end = text.find('\n## Required evidence for later parity changes', start)
              if end != -1:
                  replacement = '''## Priority after ARIA role/state relationships\n\n#228 establishes the synchronized ARIA relationship foundation and raises the benchmark planning metric to 71/105. The next roadmap block is **document structure and landmarks** (#229). That work remains separate because page-level landmark placement, uniqueness and structure have different applicability from ARIA role/property authoring.\n\n'''
                  text = text[:start] + replacement + text[end+1:]
          audit.write_text(text)
          PY
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RULES.md docs/SEVERITY-AUDIT.md docs/AXE_CORE_PARITY_AUDIT.md
          git commit -m "Docs(a11y): document ARIA role-state validation"
          git push
