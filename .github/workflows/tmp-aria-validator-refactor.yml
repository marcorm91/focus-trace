name: Temporary ARIA validator refactor

on:
  push:
    branches:
      - feat/aria-role-state-relationships-0.3.3
    paths:
      - .github/workflows/tmp-aria-validator-refactor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/aria-role-state-relationships-0.3.3
      - name: Replace parallel role relationship tables
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/audit/aria-validator.ts')
          text = path.read_text()

          text, count = re.subn(
              r"const REQUIRED_PARENT: Record<string, string\[]> = \{[\s\S]*?const IDREF_LIST = new Set\(\[",
              "const IDREF_LIST = new Set([",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not remove hard-coded ARIA relationship tables')

          old = '''function hasRequiredParent(element: Element, role: string, model: OwnershipModel): boolean {
            const parent = semanticParent(element, model);
            if (!parent) return false;
            const parentRole = effectiveAriaRole(parent);
            const direct = REQUIRED_PARENT[role];
            if (direct) return parentRole != null && direct.includes(parentRole);

            const grouped = GROUPED_PARENT[role];
            if (!grouped) return true;
            if (parentRole != null && grouped.direct.includes(parentRole)) return true;
            if (parentRole !== 'group') return false;
            const groupParent = semanticParent(parent, model);
            const groupParentRole = groupParent ? effectiveAriaRole(groupParent) : null;
            return groupParentRole != null && grouped.throughGroup.includes(groupParentRole);
          }'''
          new = '''function hasRequiredParent(element: Element, role: AriaRoleRecord, model: OwnershipModel): boolean {
            const parent = semanticParent(element, model);
            if (!parent) return false;
            const parentRole = effectiveAriaRole(parent);
            return parentRole != null && role.requiredParentRoles.includes(parentRole);
          }'''
          if old not in text:
              raise SystemExit('Could not replace hasRequiredParent')
          text = text.replace(old, new)

          old = '''      if ((REQUIRED_PARENT[explicitRole.name] || GROUPED_PARENT[explicitRole.name]) && !hasRequiredParent(element, explicitRole.name, ownership)) {
                result.push({ kind: 'required-parent', element, detail: `role=${JSON.stringify(explicitRole.name)} is not inside its required accessibility-parent context after transparent wrappers and valid aria-owns ownership are resolved.` });
              }

              const allowed = ALLOWED_CHILD[explicitRole.name];
              if (allowed) {'''
          new = '''      if (explicitRole.requiredParentRoles.length && !hasRequiredParent(element, explicitRole, ownership)) {
                result.push({ kind: 'required-parent', element, detail: `role=${JSON.stringify(explicitRole.name)} is not inside one of its synchronized WAI-ARIA required accessibility-parent roles (${explicitRole.requiredParentRoles.join(', ')}) after transparent wrappers and valid aria-owns ownership are resolved.` });
              }

              const allowed = explicitRole.allowedChildRoles;
              if (allowed.length) {'''
          if old not in text:
              raise SystemExit('Could not replace validation relationship lookup')
          text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit validator refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit/aria-validator.ts
          git commit -m "Refactor(aria): consume synchronized role relationships"
          git push
