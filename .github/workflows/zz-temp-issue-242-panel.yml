name: temp-issue-242-panel
on:
  push:
    branches:
      - feat/saved-user-flow-regression-0.7.0
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/saved-user-flow-regression-0.7.0
      - run: python tools/zz-issue-242-panel.py
      - run: |
          git rm .github/workflows/zz-temp-issue-242-panel.yml tools/zz-issue-242-panel.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add entrypoints/sidepanel/views/SavedFlowRegressionPanel.tsx entrypoints/sidepanel/views/saved-flow-regression.css
          git commit -m "Fix(replay): stop saved regressions safely"
          git push origin HEAD:feat/saved-user-flow-regression-0.7.0
