name: Temporary issue 243 final fixes

on:
  push:
    branches:
      - feat/finding-lifecycle-profiles-0.7.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/finding-lifecycle-profiles-0.7.1
      - name: Apply final fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'entrypoints/background.ts',
              "import { applyAuditProfile, type ProfiledScanResult } from '../lib/audit/audit-profiles';",
              "import {\n  applyAuditProfile,\n  auditProfileSnapshotKey,\n  profileSupportsScope,\n  scanScopeForProfile,\n  type ProfiledScanResult,\n} from '../lib/audit/audit-profiles';",
          )
          replace(
              'entrypoints/background.ts',
              "  const previousProfileId = (previous as ProfiledScanResult).auditProfile?.id;\n  const currentProfileId = current.auditProfile?.id;\n  return previousProfileId === currentProfileId;",
              "  return auditProfileSnapshotKey(previous) === auditProfileSnapshotKey(current);",
          )
          replace(
              'entrypoints/background.ts',
              "  const incoming = scan as ProfiledScanResult;\n  const profiled = incoming.auditProfile\n    ? incoming\n    : applyAuditProfile(incoming, await loadActiveAuditProfile());",
              "  const incoming = scan as ProfiledScanResult;\n  const activeProfile = await loadActiveAuditProfile();\n  const scanScope = scanScopeForProfile(incoming);\n  const profiled = incoming.auditProfile\n    ? incoming\n    : profileSupportsScope(activeProfile, scanScope)\n      ? applyAuditProfile(incoming, activeProfile, scanScope)\n      : deduplicateScanResult(incoming) as ProfiledScanResult;",
          )

          replace(
              'lib/audit/multipage-audit.ts',
              "import { applyFindingLifecycle } from './finding-lifecycle';",
              "import { auditProfileSnapshotKey } from './audit-profiles';\nimport { applyFindingLifecycle } from './finding-lifecycle';",
          )
          replace(
              'lib/audit/multipage-audit.ts',
              "  const previousScan = index >= 0 ? audit.pages[index]!.scan : undefined;\n  const record = pageRecord(applyFindingLifecycle(previousScan, scan), visualEvidence);",
              "  const previousCandidate = index >= 0 ? audit.pages[index]!.scan : undefined;\n  const previousScan = previousCandidate\n    && auditProfileSnapshotKey(previousCandidate) === auditProfileSnapshotKey(scan)\n    ? previousCandidate\n    : undefined;\n  const record = pageRecord(applyFindingLifecycle(previousScan, scan), visualEvidence);",
          )

          replace(
              'tests/multipage-audit.test.ts',
              "  it('aggregates the latest page results for the audit cover', () => {",
              "  it('aggregates deduplicated latest page results for the audit cover', () => {",
          )
          replace(
              'tests/multipage-audit.test.ts',
              "    expect(summary).toMatchObject({ pages: 2, failures: 6, reviews: 0, warnings: 0 });",
              "    expect(summary).toMatchObject({ pages: 2, failures: 2, reviews: 0, warnings: 0 });",
          )

          replace(
              'tests/focus-memory-wiring-contract.test.ts',
              "    expect(background).toContain('recordFocusMemoryScan(message.scan, message.memoryEvidence)');",
              "    expect(background).toContain('recordFocusMemoryScan(normalizedScan, remappedEvidence)');\n    expect(background).toContain('normalizeSavedScan(state, message.scan)');",
          )

          replace(
              'tests/audit-profiles.test.ts',
              "  activeAuditProfile,\n  applyAuditProfile,",
              "  activeAuditProfile,\n  applyAuditProfile,\n  auditProfileSnapshotKey,",
          )
          replace(
              'tests/audit-profiles.test.ts',
              "  it('ships a complete local AA profile', () => {\n    const profile = activeAuditProfile(emptyAuditProfileStore());\n    expect(profile.standard).toBe('AA');",
              "  it('ships a complete local profile that preserves all supported findings', () => {\n    const profile = activeAuditProfile(emptyAuditProfileStore());\n    expect(profile.standard).toBe('all');",
          )
          replace(
              'tests/audit-profiles.test.ts',
              "    expect(removed.activeProfileId).toBe('default-aa');",
              "    expect(removed.activeProfileId).toBe('default-complete');",
          )
          anchor = "  it('does not apply a profile outside its declared scope', () => {\n"
          addition = "  it('changes the profile snapshot identity when an existing profile configuration changes', () => {\n    const first = applyAuditProfile(scan([issue('one')]), custom({ scopes: ['page'], severities: ['serious'] }), 'page');\n    const second = applyAuditProfile(scan([issue('one')]), custom({ scopes: ['page'], severities: ['minor'] }), 'page');\n    expect(auditProfileSnapshotKey(first)).not.toBe(auditProfileSnapshotKey(second));\n  });\n\n"
          replace('tests/audit-profiles.test.ts', anchor, addition + anchor)

          replace(
              'tests/audit-profile-ui-contract.test.ts',
              "    expect(backgroundSource).toContain('recordFocusMemoryScan(normalizedScan, remappedEvidence)');\n  });",
              "    expect(backgroundSource).toContain('recordFocusMemoryScan(normalizedScan, remappedEvidence)');\n    expect(backgroundSource).toContain('profileSupportsScope(activeProfile, scanScope)');\n    expect(backgroundSource).toContain('auditProfileSnapshotKey(previous) === auditProfileSnapshotKey(current)');\n  });",
          )

          replace(
              'README.md',
              'Audit profiles are stored only in the browser profile and are bounded to the built-in WCAG 2.2 AA profile plus **20 custom profiles**. A profile selects page/component/Site Audit scope, WCAG A/AA/AAA target, severities and FocusTrace rule families.',
              'Audit profiles are stored only in the browser profile and are bounded to one built-in complete profile plus **20 custom profiles**. The built-in profile preserves all supported findings; custom profiles can select page/component/Site Audit scope, all supported rules or a WCAG A/AA/AAA target, severities and FocusTrace rule families.',
          )
          replace(
              'README.es.md',
              'Los perfiles de auditoría se guardan únicamente en el perfil del navegador y están limitados al perfil WCAG 2.2 AA integrado más **20 perfiles personalizados**. Un perfil selecciona el alcance página/componente/Site Audit, el objetivo WCAG A/AA/AAA, las severidades y las familias de reglas de FocusTrace.',
              'Los perfiles de auditoría se guardan únicamente en el perfil del navegador y están limitados a un perfil completo integrado más **20 perfiles personalizados**. El perfil integrado conserva todos los hallazgos compatibles; los perfiles personalizados pueden seleccionar el alcance página/componente/Site Audit, todas las reglas compatibles o un objetivo WCAG A/AA/AAA, las severidades y las familias de reglas de FocusTrace.',
          )

          workflow = Path('.github/workflows/zz-temp-issue-243-final.yml')
          workflow.unlink()
      - name: Commit fixes
        run: |
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git add -A
          git commit -m "Fix(a11y): finalize finding lifecycle profiles"
          git push origin HEAD:feat/finding-lifecycle-profiles-0.7.1
