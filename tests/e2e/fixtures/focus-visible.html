<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus visible runtime</title>
  <style>
    body {
      margin: 40px;
      font: 16px/1.5 system-ui, sans-serif;
      background: #fff;
      color: #111;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 120px;
      margin-top: 40px;
    }

    button {
      min-width: 180px;
      padding: 14px 20px;
      border: 2px solid #333;
      border-radius: 6px;
      background: #f5f5f5;
      color: #111;
      font: inherit;
    }

    #before:focus-visible,
    #visible:focus-visible {
      outline: 4px solid #005fcc;
      outline-offset: 5px;
    }

    #no-indicator:focus,
    #no-indicator:focus-visible {
      outline: none;
      box-shadow: none;
      border-color: #333;
      background: #f5f5f5;
      color: #111;
    }
  </style>
</head>
<body>
  <main>
    <h1>Focus visible runtime</h1>
    <div class="controls">
      <button id="before" type="button">Before target</button>
      <button id="no-indicator" type="button">No visible focus</button>
      <button id="visible" type="button">Visible focus</button>
    </div>
  </main>
</body>
</html>
