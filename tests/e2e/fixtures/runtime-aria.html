<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Runtime ARIA widgets</title>
</head>
<body>
  <main>
    <h1>Runtime ARIA widgets</h1>

    <section>
      <h2>Broken disclosure</h2>
      <button id="filters" type="button" aria-expanded="false" aria-controls="filters-panel">Filters</button>
      <div id="filters-panel">Filter options remain exposed while collapsed.</div>
    </section>

    <section>
      <h2>Broken tab activation</h2>
      <div role="tablist" aria-label="Account sections">
        <button id="account-tab" type="button" role="tab" aria-selected="false" aria-controls="account-panel">Account</button>
      </div>
      <div id="account-panel" role="tabpanel" hidden>Account panel</div>
    </section>

    <section>
      <h2>Broken menu focus</h2>
      <button id="menu-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="actions-menu">Actions</button>
      <div id="actions-menu" role="menu" hidden>
        <button role="menuitem" tabindex="-1">Edit</button>
      </div>
    </section>

    <section>
      <h2>Broken combobox relationships</h2>
      <label for="city-combobox">City</label>
      <input
        id="city-combobox"
        role="combobox"
        aria-expanded="false"
        aria-haspopup="grid"
        aria-controls="city-popup"
        aria-activedescendant="missing-city"
      />
      <div id="city-popup" role="listbox" hidden>
        <div id="city-madrid" role="option" aria-selected="false">Madrid</div>
        <div id="city-seville" role="option" aria-selected="false">Seville</div>
      </div>
    </section>

    <section>
      <h2>Broken single-select listbox</h2>
      <div id="priority-listbox" role="listbox" tabindex="0" aria-label="Priority">
        <div id="priority-high" role="option" aria-selected="true">High</div>
        <div id="priority-low" role="option" aria-selected="false">Low</div>
      </div>
    </section>
  </main>

  <script>
    const menuTrigger = document.querySelector('#menu-trigger');
    const menu = document.querySelector('#actions-menu');
    menuTrigger.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowDown') return;
      menuTrigger.setAttribute('aria-expanded', 'true');
      menu.hidden = false;
    });

    const cityCombobox = document.querySelector('#city-combobox');
    const cityPopup = document.querySelector('#city-popup');
    cityCombobox.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowDown') return;
      cityCombobox.setAttribute('aria-expanded', 'true');
      cityPopup.hidden = false;
    });

    const priorityListbox = document.querySelector('#priority-listbox');
    const priorityLow = document.querySelector('#priority-low');
    priorityListbox.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowDown') return;
      priorityLow.setAttribute('aria-selected', 'true');
    });
  </script>
</body>
</html>
