<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Contrast coverage fixture</title>
    <style>
      html, body { background: rgb(255, 255, 255); color: rgb(0, 0, 0); font: 16px/1.5 sans-serif; }
      input, textarea, select, #generated::before {
        color: rgb(190, 190, 190);
        background: rgb(255, 255, 255);
        font-size: 16px;
        font-weight: 400;
      }
      input::placeholder { color: rgb(190, 190, 190); opacity: 1; }
      #generated::before { content: "Generated status"; }
      #css-icon { width: 32px; height: 32px; border: 0; background-image: url("missing-menu-icon.svg"); }
      .state-target:hover { color: #777; background: #fff; }
      .dropdown-toggle:active {
        outline-color: transparent;
        outline-offset: 0;
        outline-style: solid;
        outline-width: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contrast coverage</h1>
      <label>Query <input id="query" value="Warehouses"></label>
      <label>Filter <input id="filter" placeholder="Type a value"></label>
      <label>Notes <textarea id="notes">Routes</textarea></label>
      <label>Province <select id="province"><option selected>Sevilla</option></select></label>
      <p id="generated"></p>
      <button id="css-icon" aria-label="Open menu"></button>
      <canvas id="chart" role="img" aria-label="Sales chart"></canvas>
      <nav aria-label="Repeated state controls">
        <a class="state-target dropdown-toggle" href="#one">One</a>
        <a class="state-target" href="#two">Two</a>
        <a class="state-target" href="#three">Three</a>
        <a class="state-target" href="#four">Four</a>
        <a class="state-target" href="#five">Five</a>
        <a class="state-target" href="#six">Six</a>
      </nav>
    </main>
  </body>
</html>
