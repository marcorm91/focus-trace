<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Link purpose in context</title>
  </head>
  <body>
    <main>
      <h1>Link purpose in context</h1>
      <p id="product-context">
        <a id="product-more" href="/trailpro">Read more</a> about the TrailPro backpack.
      </p>
      <span id="invoice-context" hidden>Download the April invoice as PDF</span>
      <a id="invoice-here" href="/invoice.pdf" aria-describedby="invoice-context">Here</a>
      <a id="descriptive-link" href="/annual-report">Download the annual report</a>
      <a id="empty-link" href="/empty" aria-label=""></a>
    </main>
  </body>
</html>
