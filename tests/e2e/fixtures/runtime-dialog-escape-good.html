<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Valid modal Escape fixture</title>
</head>
<body>
  <main>
    <h1>Valid modal Escape</h1>
    <button id="open-dialog" type="button">Open dialog</button>
    <div id="dialog" role="dialog" aria-modal="true" aria-label="Account settings" hidden>
      <button id="inside-dialog" type="button">Inside dialog</button>
    </div>
  </main>

  <script>
    const trigger = document.querySelector('#open-dialog');
    const dialog = document.querySelector('#dialog');
    const inside = document.querySelector('#inside-dialog');

    trigger.addEventListener('click', () => {
      dialog.hidden = false;
      inside.focus();
    });

    dialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      dialog.hidden = true;
      trigger.focus();
      event.preventDefault();
    });
  </script>
</body>
</html>
